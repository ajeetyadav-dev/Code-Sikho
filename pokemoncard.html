<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Card Reveal ⚡</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080e;
    --fg: #f0e6d3;
    --muted: #6b6358;
    --accent: #FFD700;
    --accent2: #FF6B00;
    --card-border: #c8a84e;
    --card-w: 280px;
    --card-h: 392px;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(255,215,0,0.04) 0%, transparent 65%);
    z-index: 0;
    animation: bgPulse 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes bgPulse {
    0%, 100% { opacity: .5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  #particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #flash { position: fixed; inset: 0; background: #fffbe6; opacity: 0; z-index: 200; pointer-events: none; transition: opacity .06s; }
  #flash.active { opacity: .85; }

  #scene {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--fg);
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 0 0 40px rgba(255,215,0,0.15);
  }
  .title-accent { color: var(--accent); }

  /* ── Pack ── */
  #pack-wrap {
    opacity: 1;
    transition: opacity .25s ease;
    pointer-events: auto;
  }
  #pack-wrap.gone {
    opacity: 0;
    pointer-events: none;
    position: absolute;
    visibility: hidden;
  }
  #pack {
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 14px;
    cursor: pointer;
    position: relative;
    transition: transform .3s, box-shadow .3s;
    background: linear-gradient(160deg, #d41028 0%, #8b0000 45%, #a01020 100%);
    border: 3px solid var(--accent);
    box-shadow: 0 0 40px rgba(255,215,0,0.25), 0 8px 32px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #pack::before {
    content: '';
    position: absolute;
    inset: 10px;
    border: 2px solid rgba(255,215,0,0.35);
    border-radius: 8px;
    pointer-events: none;
  }
  .pack-pattern {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 12px, rgba(255,215,0,0.04) 12px, rgba(255,215,0,0.04) 24px);
    pointer-events: none;
  }
  .pack-icon {
    font-size: 72px;
    filter: drop-shadow(0 0 25px rgba(255,215,0,0.9)) drop-shadow(0 0 60px rgba(255,165,0,0.4));
    animation: packPulse 2.5s ease-in-out infinite;
    z-index: 1;
  }
  .pack-label {
    position: absolute;
    bottom: 22px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(255,215,0,0.6);
    z-index: 1;
  }
  .pack-shine {
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
    animation: packShine 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes packPulse {
    0%, 100% { transform: scale(1); opacity: .75; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  @keyframes packShine {
    0% { transform: translateX(-100%); }
    50%, 100% { transform: translateX(100%); }
  }
  #pack:hover {
    transform: scale(1.04) translateY(-4px);
    box-shadow: 0 0 70px rgba(255,215,0,0.4), 0 12px 40px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.3);
  }
  #pack.opening {
    animation: packOpen .6s ease-in forwards;
  }
  @keyframes packOpen {
    0% { transform: scale(1); opacity: 1; filter: brightness(1); }
    30% { transform: scale(1.18); opacity: 1; filter: brightness(2.5); }
    100% { transform: scale(0.15) rotateY(220deg); opacity: 0; filter: brightness(4); }
  }

  /* ── Card wrapper ── */
  #card-wrap {
    opacity: 0;
    transform: translateY(60px) scale(.5);
    transition: opacity .1s, transform .1s;
    pointer-events: none;
    position: absolute;
  }
  #card-wrap.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity .7s ease-out, transform .7s cubic-bezier(.22,.68,.36,1.2);
    pointer-events: auto;
    position: relative;
  }
  .card-glow {
    position: absolute;
    inset: -30px;
    border-radius: 30px;
    opacity: 0;
    transition: opacity 1.2s;
    z-index: -1;
    pointer-events: none;
  }
  .card-glow.active {
    opacity: 1;
    animation: glowPulse 3.5s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* ── 3D Card ── */
  .card-container {
    perspective: 900px;
    width: var(--card-w);
    height: var(--card-h);
  }
  .card-container.floating { animation: cardFloat 5s ease-in-out infinite; }
  @keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .card-tilt {
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .15s ease-out;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    cursor: pointer;
    transition: transform .85s cubic-bezier(.175,.885,.32,1.275);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.no-transition { transition: none !important; }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    overflow: hidden;
  }

  /* ── Card Back ── */
  .card-back {
    background: linear-gradient(150deg, #c8102e 0%, #7a0a1a 50%, #a81224 100%);
    border: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-back-inner {
    width: calc(100% - 18px);
    height: calc(100% - 18px);
    border: 2px solid rgba(255,215,0,0.45);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card-back-inner::before {
    content: '';
    position: absolute;
    inset: -60%;
    background: repeating-conic-gradient(rgba(255,215,0,0.06) 0deg 8deg, transparent 8deg 16deg);
    animation: backSpin 25s linear infinite;
  }
  @keyframes backSpin { to { transform: rotate(360deg); } }
  .pokeball {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 4px solid rgba(255,215,0,0.55);
    position: relative; z-index: 1;
  }
  .pokeball::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 50%;
    background: rgba(255,215,0,0.12);
    border-radius: 50% 50% 0 0;
  }
  .pokeball::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 3px solid rgba(255,215,0,0.55);
    background: #7a0a1a;
  }

  /* ── Card Front ── */
  .card-front {
    transform: rotateY(180deg);
    background: linear-gradient(175deg, #f7ecce 0%, #ecd8a4 100%);
    border: 3px solid var(--card-border);
    display: flex;
    flex-direction: column;
  }
  .card-illust {
    height: 52%;
    min-height: 0;
    position: relative;
    background: linear-gradient(175deg, #14143a 0%, #0a0a28 100%);
    margin: 8px 8px 0 8px;
    border-radius: 8px 8px 0 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid rgba(255,215,0,0.15);
  }
  .card-illust::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 80%, rgba(255,215,0,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .energy-wrap { position: relative; width: 130px; height: 130px; }
  .e-core {
    position: absolute; inset: 22%;
    border-radius: 50%;
    animation: ePulse 2.2s ease-in-out infinite;
  }
  .e-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid;
    opacity: .4;
    animation: eRing 3.5s ease-in-out infinite;
  }
  .e-ring:nth-child(1) { inset: 5%; animation-delay: 0s; }
  .e-ring:nth-child(2) { inset: -12%; animation-delay: -1.2s; opacity: .25; }
  .e-ring:nth-child(3) { inset: -28%; animation-delay: -2.4s; opacity: .12; border-width: 1px; }
  .e-spark {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    animation: eSpark 2s ease-in-out infinite;
  }
  @keyframes ePulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.18); filter: brightness(1.4); }
  }
  @keyframes eRing {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.12) rotate(180deg); }
  }
  @keyframes eSpark {
    0%, 100% { opacity: 0; transform: translateY(0) scale(0); }
    30% { opacity: 1; transform: translateY(-10px) scale(1); }
    70% { opacity: .6; transform: translateY(-25px) scale(.5); }
  }
  .set-label {
    position: absolute;
    bottom: 6px; left: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 6.5px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 2;
  }

  .card-info {
    flex: 1;
    padding: 4px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 0;
  }
  .name-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 13px;
    color: #1a1a2e;
    letter-spacing: .8px;
  }
  .hp-badge {
    font-size: 12px;
    font-weight: 700;
    color: #c8102e;
    margin-left: auto;
  }
  .type-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    color: #777;
  }
  .type-badge {
    color: #1a1a2e;
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .card-num { margin-left: auto; font-size: 8px; color: #999; }

  .atk {
    background: rgba(255,255,255,0.55);
    border-radius: 4px;
    padding: 3px 6px;
    margin-top: 2px;
    border-left: 3px solid var(--tc, #FFD700);
  }
  .atk-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .atk-cost { font-size: 11px; letter-spacing: -1px; margin-right: 3px; }
  .atk-name { font-weight: 700; font-size: 10.5px; color: #1a1a2e; }
  .atk-dmg {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 15px;
    color: #1a1a2e;
    margin-left: auto;
  }
  .atk-text { font-size: 7.5px; color: #555; margin-top: 1px; line-height: 1.35; }

  .card-bot {
    display: flex;
    justify-content: space-between;
    font-size: 7px;
    color: #888;
    margin-top: 3px;
    padding: 0 2px;
    gap: 4px;
    flex-wrap: wrap;
  }
  .flavor {
    font-style: italic;
    font-size: 7px;
    color: #999;
    text-align: center;
    margin-top: 2px;
    padding: 0 6px;
    line-height: 1.3;
  }
  .rarity {
    position: absolute;
    bottom: 10px; right: 12px;
    font-size: 9px;
    letter-spacing: 2px;
    z-index: 2;
  }

  /* ── Holographic overlay ── */
  .holo-overlay {
    position: absolute; inset: 0;
    border-radius: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .6s;
    z-index: 60;
    mix-blend-mode: color-dodge;
    background:
      radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.3) 0%, transparent 35%),
      linear-gradient(var(--ha,130deg), rgba(255,0,0,0.1), rgba(255,160,0,0.1), rgba(255,255,0,0.1), rgba(0,255,100,0.1), rgba(0,120,255,0.1), rgba(140,0,255,0.1), rgba(255,0,140,0.1));
  }
  .holo-overlay.active { opacity: 1; }
  .holo-overlay::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 14px;
    background: repeating-conic-gradient(rgba(255,255,255,0.025) 0deg 1.5deg, transparent 1.5deg 3deg);
  }

  .hint {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: hintPulse 2.2s ease-in-out infinite;
    text-shadow: 0 0 18px rgba(255,215,0,0.4);
    min-height: 20px;
    transition: opacity .3s;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: .4; }
    50% { opacity: 1; }
  }

  .btn-open {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px 30px;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 8px;
    cursor: pointer;
    transition: all .3s;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }
  .btn-open.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity .5s, transform .5s, background .3s, box-shadow .3s;
  }
  .btn-open:hover {
    background: rgba(255,215,0,0.08);
    box-shadow: 0 0 30px rgba(255,215,0,0.25);
    transform: translateY(-2px);
  }
  .btn-open:active { transform: translateY(0); }

  @media (max-width: 420px) {
    :root { --card-w: 240px; --card-h: 336px; }
    .title { font-size: 19px; letter-spacing: 3px; }
    .name-row { font-size: 11px; }
    .atk-dmg { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="flash"></div>

<main id="scene">
  <h1 class="title">Card <span class="title-accent">Reveal</span></h1>

  <div id="pack-wrap">
    <div id="pack" role="button" tabindex="0" aria-label="Open card pack">
      <div class="pack-pattern"></div>
      <div class="pack-shine"></div>
      <span class="pack-icon">⚡</span>
      <span class="pack-label">Electric Surge</span>
    </div>
  </div>

  <div id="card-wrap">
    <div class="card-glow" id="card-glow"></div>
    <div class="card-container" id="card-container">
      <div class="card-tilt" id="card-tilt">
        <div class="card" id="card">
          <div class="card-face card-back">
            <div class="card-back-inner"><div class="pokeball"></div></div>
          </div>
          <div class="card-face card-front" id="card-front">
            <div id="card-content"></div>
            <div class="holo-overlay" id="holo"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">Click to Open</p>
  <button class="btn-open" id="btn-another" aria-label="Open another pack">Open Another</button>
</main>

   DOM
   ═══════════════════════════════════════ */

   Particles
   ═══════════════════════════════════════ */
const parts = [];

class Part {
  constructor(x, y, burst) {
    this.x = x != null ? x : Math.random() * cvs.width;
    this.y = y != null ? y : Math.random() * cvs.height;
    this.burst = !!burst;
    if (burst) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 9;
      this.vx = Math.cos(a) * s;
      this.vy = Math.sin(a) * s;
      this.size = 1.5 + Math.random() * 3;
      this.decay = .012 + Math.random() * .025;
    } else {
      this.vx = (Math.random() - .5) * .6;
      this.vy = -.4 - Math.random() * 1.2;
      this.size = .8 + Math.random() * 1.8;
      this.decay = .002 + Math.random() * .004;
    }
    this.life = 1;
    const hue = 38 + Math.random() * 22;
    const lit = burst ? 65 + Math.random() * 35 : 45 + Math.random() * 40;
    this.col = 'hsl(' + hue + ',100%,' + lit + '%)';
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.burst) {
      this.vx += (Math.random() - .5) * .4;
      this.vy += (Math.random() - .5) * .4;
      this.vx *= .98;
      this.vy *= .98;
    }
  }
  draw() {
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.col;
    ctx.shadowColor = this.col;
    ctx.shadowBlur = this.burst ? 18 : 10;
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(.3, this.size * this.life), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* Lightning bolts */
const bolts = [];

function spawnBolts(cx, cy, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = 180 + Math.random() * 350;
    bolts.push({
      x1: cx, y1: cy,
      x2: cx + Math.cos(a) * d,
      y2: cy + Math.sin(a) * d,
      life: .25 + Math.random() * .35,
      seg: 5 + Math.floor(Math.random() * 7)
    });
  }
}

function drawBolt(b) {
  if (b.life <= 0) return;
  ctx.save();
  ctx.globalAlpha = b.life;
  ctx.strokeStyle = 'rgba(255,215,0,0.85)';
  ctx.lineWidth = 1.5 + b.life * 2;
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(b.x1, b.y1);
  const dx = (b.x2 - b.x1) / b.seg;
  const dy = (b.y2 - b.y1) / b.seg;
  for (let i = 1; i < b.seg; i++) {
    ctx.lineTo(b.x1 + dx * i + (Math.random() - .5) * 50, b.y1 + dy * i + (Math.random() - .5) * 30);
  }
  ctx.lineTo(b.x2, b.y2);
  ctx.stroke();
  ctx.restore();
}

function spawnHoloSparks(cx, cy) {
  for (let i = 0; i < 6; i++) {
    const p = new Part(cx + (Math.random() - .5) * 200, cy + (Math.random() - .5) * 300, false);
    p.size = 1 + Math.random() * 1.5;
    p.decay = .003 + Math.random() * .006;
    p.vy = -.3 - Math.random() * .5;
    p.vx = (Math.random() - .5) * .3;
    parts.push(p);
  }
}

/* Main loop */
function loop() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  if (parts.length < 90) parts.push(new Part(Math.random() * cvs.width, cvs.height + 5, false));
  for (let i = parts.length - 1; i >= 0; i--) {
    parts[i].update();
    parts[i].draw();
    if (parts[i].life <= 0) parts.splice(i, 1);
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    drawBolt(bolts[i]);
    bolts[i].life -= .018;
    if (bolts[i].life <= 0) bolts.splice(i, 1);
  }
  if (state === 'revealed' && Math.random() < .12) spawnHoloSparks(cvs.width / 2, cvs.height / 2);
  requestAnimationFrame(loop);
}
loop();

/* ═══════════════════════════════════════
   Flash
   ═══════════════════════════════════════ */
function triggerFlash(ms) {
  ms = ms || 150;
  flashEl.classList.add('active');
  setTimeout(function() { flashEl.classList.remove('active'); }, ms);
}

/* ═══════════════════════════════════════
   Build Card
   ═══════════════════════════════════════ */
function buildCard(pk) {
  var sparks = '';
  for (var i = 0; i < 8; i++) {
    var sx = 20 + Math.random() * 90;
    var sy = 15 + Math.random() * 100;
    var del = (Math.random() * 2).toFixed(1);
    var col = Math.random() > .5 ? pk.c1 : pk.c2;
    sparks += '<div class="e-spark" style="left:' + sx + '%;top:' + sy + '%;background:' + col + ';box-shadow:0 0 6px ' + col + ';animation-delay:' + del + 's;"></div>';
  }
  var retDots = '';
  for (var r = 0; r < pk.ret; r++) retDots += '●';
  for (var r2 = 0; r2 < Math.max(0, 3 - pk.ret); r2++) retDots += '○';

  var atksHTML = '';
  for (var j = 0; j < pk.atks.length; j++) {
    var a = pk.atks[j];
    atksHTML += '<div class="atk" style="--tc:' + pk.tc + '">' +
      '<div class="atk-head">' +
        '<span><span class="atk-cost">' + a.cost + '</span><span class="atk-name">' + a.name + '</span></span>' +
        '<span class="atk-dmg">' + a.dmg + '</span>' +
      '</div>' +
      '<div class="atk-text">' + a.txt + '</div>' +
    '</div>';
  }

  cardContent.innerHTML =
    '<div class="card-illust">' +
      '<div class="energy-wrap">' +
        '<div class="e-ring" style="border-color:' + pk.c1 + '"></div>' +
        '<div class="e-ring" style="border-color:' + pk.c2 + '"></div>' +
        '<div class="e-ring" style="border-color:' + pk.c1 + '50"></div>' +
        '<div class="e-core" style="background:radial-gradient(circle,' + pk.c1 + ',' + pk.c2 + ',transparent 75%);box-shadow:0 0 35px ' + pk.c1 + ',0 0 70px ' + pk.c2 + '70,inset 0 0 18px ' + pk.c1 + ';"></div>' +
        sparks +
      '</div>' +
      '<span class="set-label">' + pk.set + '</span>' +
    '</div>' +
    '<div class="card-info">' +
      '<div class="name-row"><span>' + pk.name + '</span><span class="hp-badge">HP ' + pk.hp + '</span></div>' +
      '<div class="type-row"><span class="type-badge" style="background:' + pk.tc + '">' + pk.type + '</span><span class="card-num">' + pk.num + '</span></div>' +
      atksHTML +
      '<div class="card-bot"><span>Weakness: ' + pk.weak + '</span><span>Resist: ' + pk.res + '</span><span>Retreat: ' + retDots + '</span></div>' +
      '<div class="flavor">' + pk.flav + '</div>' +
    '</div>' +
    '<div class="rarity" style="color:' + pk.rc + ';text-shadow:0 0 8px ' + pk.rc + '">' + pk.rarity + '</div>';

  cardContent.style.setProperty('--tc', pk.tc);
}

/* ═══════════════════════════════════════
   State Machine
   ═══════════════════════════════════════ */
var state = 'pack';
var curPk = null;
var locked = false; // prevent double-clicks

function go(newState) {
  if (locked) return;
  locked = true;

  var cx = cvs.width / 2;
  var cy = cvs.height / 2;

  if (newState === 'pack') {
    state = 'pack';
    // Reset everything
    packEl.classList.remove('opening');
    packWrap.classList.remove('gone');
    cardWrap.classList.remove('visible');
    btnAnother.classList.remove('show');
    hintEl.textContent = 'Click to Open';
    hintEl.style.opacity = '';
    cardEl.classList.add('no-transition');
    cardEl.classList.remove('flipped');
    holoEl.classList.remove('active');
    cardGlow.classList.remove('active');
    cardContainer.classList.remove('floating');
    cardTilt.style.transform = '';
    // Force reflow then re-enable transition
    void cardEl.offsetHeight;
    cardEl.classList.remove('no-transition');
    cardEl.style.transition = 'transform .85s cubic-bezier(.175,.885,.32,1.275)';
    locked = false;
    return;
  }

  if (newState === 'rising') {
    state = 'rising';
    // Pick random Pokémon
    curPk = DATA[Math.floor(Math.random() * DATA.length)];
    buildCard(curPk);
    cardGlow.style.background = 'radial-gradient(ellipse,' + curPk.c1 + '30 0%,transparent 65%)';

    // Hide pack
    packWrap.classList.add('gone');

    // Reset card to face-down (no transition to avoid visible flip-back)
    cardEl.classList.add('no-transition');
    cardEl.classList.remove('flipped');
    holoEl.classList.remove('active');
    cardGlow.classList.remove('active');
    cardContainer.classList.remove('floating');
    cardTilt.style.transform = '';
    cardEl.style.transition = 'transform .85s cubic-bezier(.175,.885,.32,1.275)';

    // Small delay to let DOM settle, then show card with animation
    setTimeout(function() {
      cardEl.classList.remove('no-transition');
      cardWrap.classList.add('visible');
      hintEl.textContent = 'Click to Reveal';
      setTimeout(function() {
        state = 'facedown';
        locked = false;
      }, 750);
    }, 100);
    return;
  }

  if (newState === 'revealing') {
    state = 'revealing';
    hintEl.style.opacity = '0';
    cardEl.classList.remove('no-transition');
    cardEl.classList.add('flipped');
    triggerFlash(220);
    // Lightning burst
    for (var i = 0; i < 90; i++) parts.push(new Part(cx, cy, true));
    spawnBolts(cx, cy, 8);
    setTimeout(function() {
      holoEl.classList.add('active');
      cardGlow.classList.add('active');
      cardContainer.classList.add('floating');
      // Remove flip transition so tilt is responsive
      cardEl.classList.add('no-transition');
      state = 'revealed';
      btnAnother.classList.add('show');
      locked = false;
    }, 900);
    return;
  }
}

/* ═══════════════════════════════════════
   Events
   ═══════════════════════════════════════ */

// Open pack
function onPackClick() {
  if (state !== 'pack' || locked) return;
  locked = true;
  packEl.classList.add('opening');
  triggerFlash(120);
  var cx = cvs.width / 2, cy = cvs.height / 2;
  for (var i = 0; i < 50; i++) parts.push(new Part(cx, cy, true));
  spawnBolts(cx, cy, 4);
  setTimeout(function() {
    locked = false;
    go('rising');
  }, 620);
}
packEl.addEventListener('click', onPackClick);
packEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPackClick(); }
});

// Click card to reveal
function onCardClick() {
  if (state === 'facedown' && !locked) go('revealing');
}
cardEl.addEventListener('click', onCardClick);
cardEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onCardClick(); }
});

// 3D tilt + holo tracking
cardTilt.addEventListener('mousemove', function(e) {
  if (state !== 'facedown' && state !== 'revealed') return;
  var r = cardTilt.getBoundingClientRect();
  var nx = (e.clientX - r.left) / r.width - .5;
  var ny = (e.clientY - r.top) / r.height - .5;
  cardTilt.style.transform = 'rotateY(' + (nx * 22) + 'deg) rotateX(' + (-ny * 22) + 'deg)';
  if (state === 'revealed') {
    cardEl.style.setProperty('--mx', ((nx + .5) * 100).toFixed(1) + '%');
    cardEl.style.setProperty('--my', ((ny + .5) * 100).toFixed(1) + '%');
    cardEl.style.setProperty('--ha', ((nx + .5) * 360).toFixed(1) + 'deg');
  }
});
cardTilt.addEventListener('mouseleave', function() {
  cardTilt.style.transform = '';
});

// Open another
btnAnother.addEventListener('click', function() { go('pack'); });

// Hover sparks on pack
packEl.addEventListener('mousemove', function(e) {
  if (state !== 'pack' || Math.random() > .35) return;
  parts.push(new Part(e.clientX, e.clientY, true));
});
</script>
