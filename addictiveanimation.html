<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Most Addictive Animation On The Internet</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden}
        body{background:#08030f;font-family:'Space Grotesk',sans-serif;cursor:none}
        #c{display:block;width:100%;height:100%}
        .overlay{position:fixed;inset:0;pointer-events:none;z-index:10}
        .hint{
            position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
            color:rgba(255,255,255,0.3);font-size:12px;font-weight:300;
            letter-spacing:4px;text-transform:uppercase;
            opacity:1;transition:opacity 3s ease 1s;
        }
        .hint.fade{opacity:0}
        .counter{
            position:absolute;top:24px;right:28px;
            color:rgba(255,255,255,0.12);font-size:11px;font-weight:300;
            letter-spacing:2px;text-transform:uppercase;
        }
        .cdot{
            position:fixed;width:6px;height:6px;
            background:rgba(255,190,110,0.9);border-radius:50%;
            pointer-events:none;transform:translate(-50%,-50%);
            z-index:20;mix-blend-mode:screen;
        }
        .cring{
            position:fixed;width:38px;height:38px;
            border:1.5px solid rgba(255,180,100,0.3);border-radius:50%;
            pointer-events:none;transform:translate(-50%,-50%);
            z-index:20;transition:width .2s ease,height .2s ease,border-color .25s ease;
        }
        .cring.press{width:22px;height:22px;border-color:rgba(255,180,100,0.65)}
        @media(max-width:768px){
            .cdot,.cring{display:none}
            body{cursor:default}
        }
        @media(prefers-reduced-motion:reduce){
            .hint{transition:none}
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="overlay">
        <div class="hint" id="hint">move & click to interact</div>
        <div class="counter" id="counter">18 blobs</div>
    </div>
    <div class="cdot" id="cdot"></div>
    <div class="cring" id="cring"></div>

    <script>
    (function(){
        'use strict';

        /* ── Canvas & WebGL ── */
        const canvas = document.getElementById('c');
        const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
        if (!gl) {
            document.body.innerHTML = '<p style="color:#fff;padding:40px;font-family:sans-serif">WebGL is not supported in this browser.</p>';
            return;
        }

        const cdot = document.getElementById('cdot');
        const cring = document.getElementById('cring');
        const hintEl = document.getElementById('hint');
        const counterEl = document.getElementById('counter');

        const MAX_BALLS = 30;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const SPEED = reducedMotion ? 0.2 : 1.0;

        let W, H, aspect;
        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            aspect = W / H;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        /* ── Shaders ── */
        const VERT = `
            attribute vec2 aPos;
            varying vec2 vUv;
            void main(){
                vUv = aPos * 0.5 + 0.5;
                gl_Position = vec4(aPos, 0.0, 1.0);
            }
        `;

        const FRAG = `
            precision highp float;
            varying vec2 vUv;
            uniform vec2 uRes;
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uPress;
            #define N 30
            uniform vec4 uB[N];

            /* Warm 6-stop color palette */
            vec3 palette(float t){
                t = fract(t);
                vec3 c0 = vec3(1.0, 0.38, 0.36);
                vec3 c1 = vec3(1.0, 0.65, 0.22);
                vec3 c2 = vec3(1.0, 0.82, 0.05);
                vec3 c3 = vec3(1.0, 0.42, 0.08);
                vec3 c4 = vec3(0.95, 0.22, 0.48);
                vec3 c5 = vec3(1.0, 0.50, 0.58);
                float s = t * 6.0;
                float i = floor(s);
                float f = fract(s);
                if(i < 1.0) return mix(c0, c1, f);
                if(i < 2.0) return mix(c1, c2, f);
                if(i < 3.0) return mix(c2, c3, f);
                if(i < 4.0) return mix(c3, c4, f);
                if(i < 5.0) return mix(c4, c5, f);
                return mix(c5, c0, f);
            }

            /* Background noise */
            float hash(vec2 p){
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
            }
            float noise(vec2 p){
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f*f*(3.0-2.0*f);
                return mix(
                    mix(hash(i), hash(i+vec2(1,0)), f.x),
                    mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x),
                    f.y
                );
            }

            void main(){
                float asp = uRes.x / uRes.y;
                vec2 p = (vUv - 0.5) * vec2(asp, 1.0) * 2.0;

                /* Metaball field accumulation */
                float field = 0.0;
                vec3 wCol = vec3(0.0);

                for(int i = 0; i < N; i++){
                    float r = uB[i].z;
                    if(r < 0.001) continue;
                    vec2 d = p - uB[i].xy;
                    float f = (r*r) / max(dot(d,d), 0.00001);
                    field += f;
                    wCol += palette(uB[i].w) * f;
                }

                /* Mouse acts as extra metaball */
                vec2 mp = (uMouse - 0.5) * vec2(asp, 1.0) * 2.0;
                float mr = mix(0.2, 0.32, uPress);
                vec2 md = p - mp;
                float mf = (mr*mr) / max(dot(md,md), 0.00001);
                field += mf;
                wCol = mix(wCol, vec3(1.0, 0.93, 0.78), mf / max(field, 0.001));

                wCol /= max(field, 0.001);

                float thr = 1.0;
                vec3 col;

                if(field > thr){
                    float edge = smoothstep(thr, thr + 0.5, field);

                    /* Base color */
                    vec3 base = wCol * 1.15;

                    /* Iridescent sheen */
                    vec3 iri = 0.5 + 0.5 * cos(6.2832 * (wCol*0.3 + vec3(0.0, 0.33, 0.67) + uTime*0.08));
                    base = mix(base, iri, 0.18);

                    /* Fresnel edge glow */
                    float fres = 1.0 - edge;
                    fres = fres * fres;
                    base += vec3(1.0, 0.85, 0.6) * fres * 0.45;

                    /* Caustics */
                    float cau = 0.0;
                    cau += sin(p.x*12.0 + uTime*1.3) * sin(p.y*14.0 + uTime*1.1);
                    cau += sin(p.x*8.0 - uTime*0.7) * sin(p.y*10.0 + uTime*0.8);
                    cau = cau*0.5 + 0.5;
                    cau = pow(cau, 5.0) * 0.13;
                    base += vec3(1.0, 0.95, 0.8) * cau * edge;

                    /* Depth darkening */
                    base *= 0.87 + 0.13 * edge;

                    /* Center hot-spot */
                    base += vec3(1.0, 0.97, 0.88) * pow(edge, 6.0) * 0.18;

                    col = base;
                } else {
                    /* Background */
                    vec3 bg = vec3(0.028, 0.013, 0.042);
                    bg += noise(vUv * 7.0 + uTime * 0.04) * 0.012;
                    bg += 0.007 * sin(uTime*0.3 + vUv.x*3.0) * sin(uTime*0.25 + vUv.y*3.0);

                    /* Outer glow */
                    float glow = exp(-4.0 * (thr - field));
                    col = bg + wCol * glow * 0.5;

                    /* Faint field ripples */
                    float lines = pow(abs(sin(field * 8.0)), 8.0);
                    col += wCol * lines * 0.035 * glow;
                }

                /* Vignette */
                float vig = 1.0 - 0.42 * pow(length(vUv - 0.5) * 1.5, 2.5);
                col *= vig;

                /* Breathing */
                col *= 0.97 + 0.03 * sin(uTime * 0.5);

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        /* Compile & link */
        function makeShader(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(s));
                return null;
            }
            return s;
        }
        const vs = makeShader(gl.VERTEX_SHADER, VERT);
        const fs = makeShader(gl.FRAGMENT_SHADER, FRAG);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            console.error(gl.getProgramInfoLog(prog));
        }
        gl.useProgram(prog);

        /* Fullscreen quad */
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'aPos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        /* Uniform locations */
        const uRes   = gl.getUniformLocation(prog, 'uRes');
        const uTime  = gl.getUniformLocation(prog, 'uTime');
        const uMouse = gl.getUniformLocation(prog, 'uMouse');
        const uPress = gl.getUniformLocation(prog, 'uPress');
        const uBalls = gl.getUniformLocation(prog, 'uB[0]');

        /* ── Ball system ── */
        const ballData = new Float32Array(MAX_BALLS * 4); // x, y, radius, hue
        const balls = [];

        function addBall(o) {
            if (balls.length >= MAX_BALLS) return;
            balls.push({
                cx: o.cx, cy: o.cy,
                ax: o.ax, ay: o.ay,
                fx: o.fx, fy: o.fy,
                px: o.px, py: o.py,
                r: o.r, hue: o.hue,
                born: o.born != null ? o.born : performance.now(),
                vx: 0, vy: 0
            });
            updateCounter();
        }

        function updateCounter() {
            counterEl.textContent = balls.length + ' blob' + (balls.length !== 1 ? 's' : '');
        }

        /* Initialize 18 balls in 3 concentric rings */
        (function init() {
            const rings = [
                { count: 6, dist: 0.32, rMin: 0.13, rMax: 0.16, fBase: 0.18, aBase: 0.18 },
                { count: 6, dist: 0.58, rMin: 0.10, rMax: 0.13, fBase: 0.30, aBase: 0.22 },
                { count: 6, dist: 0.82, rMin: 0.07, rMax: 0.10, fBase: 0.42, aBase: 0.25 }
            ];
            let idx = 0;
            rings.forEach(function(ring, ri) {
                for (let j = 0; j < ring.count; j++) {
                    const angle = (j / ring.count) * Math.PI * 2 + ri * 0.35;
                    addBall({
                        cx: Math.cos(angle) * ring.dist,
                        cy: Math.sin(angle) * ring.dist,
                        ax: ring.aBase + Math.random() * 0.2,
                        ay: ring.aBase + Math.random() * 0.2,
                        fx: (ring.fBase + Math.random() * 0.25) * SPEED,
                        fy: (ring.fBase + Math.random() * 0.25) * SPEED,
                        px: Math.random() * Math.PI * 2,
                        py: Math.random() * Math.PI * 2,
                        r: ring.rMin + Math.random() * (ring.rMax - ring.rMin),
                        hue: idx / 18,
                        born: performance.now() + idx * 55 // staggered entrance
                    });
                    idx++;
                }
            });
        })();

        /* ── Input ── */
        let mx = 0.5, my = 0.5, mActive = false, mDown = false;
        let cursorRawX = W / 2, cursorRawY = H / 2;
        let smoothDotX = cursorRawX, smoothDotY = cursorRawY;
        let smoothRingX = cursorRawX, smoothRingY = cursorRawY;
        let hintGone = false;

        function onPointerMove(x, y) {
            mx = x / W;
            my = 1.0 - y / H;
            mActive = true;
            cursorRawX = x;
            cursorRawY = y;
            if (!hintGone) { hintGone = true; hintEl.classList.add('fade'); }
        }

        function spawnBlob() {
            if (balls.length >= MAX_BALLS) return;
            const bx = (mx - 0.5) * aspect * 2;
            const by = (my - 0.5) * 2;

            /* Push nearby blobs away for satisfying ripple */
            for (let i = 0; i < balls.length; i++) {
                const b = balls[i];
                const dx = b.cx - bx;
                const dy = b.cy - by;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 0.6 && dist > 0.001) {
                    const force = 0.25 / (dist + 0.08);
                    b.vx += (dx / dist) * force;
                    b.vy += (dy / dist) * force;
                }
            }

            addBall({
                cx: bx, cy: by,
                ax: 0.04 + Math.random() * 0.18,
                ay: 0.04 + Math.random() * 0.18,
                fx: (0.3 + Math.random() * 0.4) * SPEED,
                fy: (0.3 + Math.random() * 0.4) * SPEED,
                px: Math.random() * Math.PI * 2,
                py: Math.random() * Math.PI * 2,
                r: 0.07 + Math.random() * 0.06,
                hue: Math.random(),
                born: performance.now()
            });
        }

        canvas.addEventListener('mousemove', function(e) { onPointerMove(e.clientX, e.clientY); });
        canvas.addEventListener('mousedown', function() {
            mDown = true; cring.classList.add('press'); spawnBlob();
        });
        canvas.addEventListener('mouseup', function() {
            mDown = false; cring.classList.remove('press');
        });
        canvas.addEventListener('mouseleave', function() { mActive = false; });

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            var t = e.touches[0];
            onPointerMove(t.clientX, t.clientY);
            mDown = true; spawnBlob();
        }, { passive: false });
        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            var t = e.touches[0];
            onPointerMove(t.clientX, t.clientY);
        }, { passive: false });
        canvas.addEventListener('touchend', function() { mDown = false; });

        /* ── Render loop ── */
        function frame(now) {
            var t = now * 0.001 * SPEED;

            /* Update ball positions */
            for (var i = 0; i < MAX_BALLS; i++) {
                var idx = i * 4;
                if (i < balls.length) {
                    var b = balls[i];
                    var age = (now - b.born) * 0.001;
                    var rawGrow = Math.min(1.0, Math.max(0, age) * 2.5);
                    var grow = rawGrow * rawGrow * (3.0 - 2.0 * rawGrow); // smoothstep
                    var wobble = 1.0 + 0.025 * Math.sin(t * 2.2 + b.px * 3.0);

                    /* Lissajous base motion */
                    var x = b.cx + b.ax * Math.sin(b.fx * t + b.px);
                    var y = b.cy + b.ay * Math.cos(b.fy * t + b.py);

                    /* Apply push velocity with damping */
                    b.vx *= 0.94;
                    b.vy *= 0.94;
                    x += b.vx * 0.016;
                    y += b.vy * 0.016;

                    /* Mouse attraction */
                    if (mActive) {
                        var mmx = (mx - 0.5) * aspect * 2;
                        var mmy = (my - 0.5) * 2;
                        var dx = mmx - x;
                        var dy = mmy - y;
                        var d = Math.sqrt(dx * dx + dy * dy);
                        var pull = 0.025 / (d + 0.12);
                        x += dx * pull;
                        y += dy * pull;
                    }

                    /* Keep in bounds */
                    var boundX = aspect * 0.92;
                    x = Math.max(-boundX, Math.min(boundX, x));
                    y = Math.max(-0.92, Math.min(0.92, y));

                    ballData[idx]     = x;
                    ballData[idx + 1] = y;
                    ballData[idx + 2] = Math.max(0.001, b.r * grow * wobble);
                    ballData[idx + 3] = ((b.hue + t * 0.012) % 1.0 + 1.0) % 1.0;
                } else {
                    ballData[idx] = 0;
                    ballData[idx + 1] = 0;
                    ballData[idx + 2] = 0;
                    ballData[idx + 3] = 0;
                }
            }

            /* Set uniforms & draw */
            gl.uniform2f(uRes, canvas.width, canvas.height);
            gl.uniform1f(uTime, t);
            gl.uniform2f(uMouse, mx, my);
            gl.uniform1f(uPress, mDown ? 1.0 : 0.0);
            gl.uniform4fv(uBalls, ballData);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            /* Smooth cursor follow */
            smoothDotX += (cursorRawX - smoothDotX) * 0.18;
            smoothDotY += (cursorRawY - smoothDotY) * 0.18;
            smoothRingX += (cursorRawX - smoothRingX) * 0.09;
            smoothRingY += (cursorRawY - smoothRingY) * 0.09;

            cdot.style.left = smoothDotX + 'px';
            cdot.style.top  = smoothDotY + 'px';
            cring.style.left = smoothRingX + 'px';
            cring.style.top  = smoothRingY + 'px';

            requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
