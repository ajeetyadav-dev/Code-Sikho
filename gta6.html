<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI — Vice City</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --pink: #ff2d6f;
    --cyan: #00f0ff;
    --orange: #ff6b2b;
    --purple: #b44dff;
    --dark: #06060e;
    --darker: #030308;
    --text: #f0eef6;
    --muted: rgba(240,238,246,0.35);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--darker);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: default;
    user-select: none;
  }

  /* === BACKGROUND SCENE === */
  .bg-scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .sky-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      #0a0520 0%,
      #1a0a3a 15%,
      #3d1255 28%,
      #8b1a4a 40%,
      #d4453a 52%,
      #ff8c42 62%,
      #ffcf56 70%,
      #ffcf56 72%,
      #1a3a5c 73%,
      #0d1f33 85%,
      #06060e 100%
    );
    animation: skyPulse 12s ease-in-out infinite alternate;
  }

  @keyframes skyPulse {
    0% { filter: brightness(1) saturate(1); }
    50% { filter: brightness(1.08) saturate(1.15); }
    100% { filter: brightness(0.95) saturate(1.05); }
  }

  /* Sun */
  .sun {
    position: absolute;
    bottom: 27%;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, #fff8e0 0%, #ffcf56 30%, #ff8c42 60%, transparent 100%);
    border-radius: 50%;
    filter: blur(2px);
    animation: sunPulse 6s ease-in-out infinite alternate;
  }

  .sun::after {
    content: '';
    position: absolute;
    inset: -40px;
    background: radial-gradient(circle, rgba(255,207,86,0.3) 0%, transparent 70%);
    border-radius: 50%;
  }

  @keyframes sunPulse {
    0% { transform: translateX(-50%) scale(1); opacity: 0.95; }
    100% { transform: translateX(-50%) scale(1.06); opacity: 1; }
  }

  /* Sun horizontal lines (GTA style) */
  .sun-lines {
    position: absolute;
    bottom: calc(27% + 20px);
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 140px;
    overflow: hidden;
  }

  .sun-lines span {
    display: block;
    height: 2px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, transparent, rgba(255,207,86,0.6), transparent);
    animation: sunLineSlide 4s ease-in-out infinite alternate;
  }

  @keyframes sunLineSlide {
    0% { transform: scaleX(0.7); opacity: 0.4; }
    100% { transform: scaleX(1.1); opacity: 0.8; }
  }

  /* City skyline */
  .skyline {
    position: absolute;
    bottom: 27%;
    left: 0;
    width: 100%;
    height: 120px;
  }

  .building {
    position: absolute;
    bottom: 0;
    background: #0a0a18;
    border-radius: 2px 2px 0 0;
  }

  .building::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(0,240,255,0.15);
  }

  /* Water */
  .water {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 27%;
    background: linear-gradient(180deg, #0d1f33 0%, #0a1628 50%, #06060e 100%);
    overflow: hidden;
  }

  .water-reflection {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 100%;
    background: linear-gradient(180deg, rgba(255,140,66,0.25) 0%, rgba(255,140,66,0.05) 40%, transparent 100%);
    filter: blur(20px);
    animation: waterShimmer 3s ease-in-out infinite alternate;
  }

  @keyframes waterShimmer {
    0% { transform: translateX(-50%) scaleX(1); }
    100% { transform: translateX(-50%) scaleX(1.4); }
  }

  .water-line {
    position: absolute;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent 10%, rgba(0,240,255,0.06) 50%, transparent 90%);
  }

  /* Stars */
  .stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 40%;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.8); }
    100% { opacity: 0.9; transform: scale(1.2); }
  }

  /* Palm tree silhouettes */
  .palm {
    position: absolute;
    bottom: 27%;
    z-index: 2;
  }

  .palm-trunk {
    width: 8px;
    height: 100px;
    background: #080812;
    border-radius: 4px;
    transform: rotate(var(--rot));
    transform-origin: bottom center;
  }

  .palm-leaves {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 40px;
  }

  .palm-leaf {
    position: absolute;
    width: 45px;
    height: 12px;
    background: #080812;
    border-radius: 0 50% 50% 0;
    transform-origin: left center;
    bottom: 50%;
    left: 50%;
  }

  /* === SCAN LINES === */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 99;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  }

  /* === NOISE OVERLAY === */
  .noise {
    position: fixed;
    inset: 0;
    z-index: 98;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px;
  }

  /* === BOKEH PARTICLES === */
  .bokeh-container {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }

  .bokeh {
    position: absolute;
    border-radius: 50%;
    animation: bokehFloat var(--dur) ease-in-out infinite alternate;
    opacity: 0;
  }

  @keyframes bokehFloat {
    0% { transform: translate(0, 0) scale(1); opacity: var(--o1); }
    33% { transform: translate(var(--dx1), var(--dy1)) scale(1.2); opacity: var(--o2); }
    66% { transform: translate(var(--dx2), var(--dy2)) scale(0.8); opacity: var(--o1); }
    100% { transform: translate(var(--dx3), var(--dy3)) scale(1.1); opacity: var(--o2); }
  }

  /* === MAIN CONTENT === */
  .menu-container {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding-left: 8%;
  }

  /* === LOGO === */
  .logo-wrap {
    margin-bottom: 50px;
    position: relative;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(60px, 10vw, 140px);
    letter-spacing: 0.05em;
    position: relative;
    line-height: 1;
    color: #fff;
    text-shadow:
      0 0 20px rgba(255,45,111,0.5),
      0 0 60px rgba(255,45,111,0.2);
  }

  .logo .roman {
    font-size: 0.45em;
    vertical-align: super;
    margin-left: 4px;
    color: var(--pink);
    text-shadow: 0 0 15px var(--pink), 0 0 40px rgba(255,45,111,0.4);
  }

  /* Glitch effect */
  .logo-glitch {
    position: relative;
  }

  .logo-glitch::before,
  .logo-glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(60px, 10vw, 140px);
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .logo-glitch::before {
    color: var(--cyan);
    z-index: -1;
    animation: glitch1 3s infinite linear alternate-reverse;
    clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
  }

  .logo-glitch::after {
    color: var(--pink);
    z-index: -1;
    animation: glitch2 2s infinite linear alternate-reverse;
    clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
  }

  @keyframes glitch1 {
    0%, 90%, 100% { transform: translate(0); }
    92% { transform: translate(-6px, -2px); }
    94% { transform: translate(5px, 1px); }
    96% { transform: translate(-3px, 0); }
    98% { transform: translate(4px, -1px); }
  }

  @keyframes glitch2 {
    0%, 88%, 100% { transform: translate(0); }
    90% { transform: translate(5px, 2px); }
    93% { transform: translate(-4px, -1px); }
    95% { transform: translate(3px, 1px); }
    97% { transform: translate(-5px, 0); }
  }

  .subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 300;
    font-size: clamp(14px, 2vw, 22px);
    letter-spacing: 0.6em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(0,240,255,0.4);
    margin-top: 8px;
    opacity: 0.8;
  }

  /* === MENU ITEMS === */
  .menu-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 420px;
    max-width: 85vw;
  }

  .menu-item {
    position: relative;
    padding: 14px 24px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: clamp(18px, 2.5vw, 26px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
    border-left: 3px solid transparent;
    overflow: hidden;
  }

  .menu-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,45,111,0.12) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .menu-item::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--pink), transparent);
    transition: width 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .menu-item:hover,
  .menu-item.active {
    color: #fff;
    border-left-color: var(--pink);
    transform: translateX(12px);
    text-shadow: 0 0 15px rgba(255,45,111,0.4);
  }

  .menu-item:hover::before,
  .menu-item.active::before {
    opacity: 1;
  }

  .menu-item:hover::after,
  .menu-item.active::after {
    width: 100%;
  }

  .menu-item .item-icon {
    display: inline-block;
    width: 28px;
    margin-right: 14px;
    text-align: center;
    font-size: 0.85em;
    transition: color 0.3s ease, transform 0.3s ease;
  }

  .menu-item:hover .item-icon,
  .menu-item.active .item-icon {
    color: var(--pink);
    transform: scale(1.15);
  }

  .menu-item .arrow {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%) translateX(-10px);
    opacity: 0;
    color: var(--pink);
    font-size: 0.75em;
    transition: all 0.35s ease;
  }

  .menu-item:hover .arrow,
  .menu-item.active .arrow {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  /* Selection indicator */
  .menu-item .selector {
    position: absolute;
    left: -18px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 8px;
    height: 8px;
    background: var(--pink);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--pink), 0 0 24px rgba(255,45,111,0.3);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .menu-item.active .selector {
    transform: translateY(-50%) scale(1);
  }

  /* === SUBMENU === */
  .submenu-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 420px;
    max-width: 90vw;
    height: 100vh;
    background: linear-gradient(135deg, rgba(6,6,14,0.95) 0%, rgba(10,10,24,0.92) 100%);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-left: 1px solid rgba(255,45,111,0.15);
    z-index: 50;
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    padding: 80px 40px 40px;
    overflow-y: auto;
  }

  .submenu-panel.open {
    transform: translateX(0);
  }

  .submenu-panel .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cyan);
    cursor: pointer;
    margin-bottom: 30px;
    padding: 8px 0;
    border: none;
    background: none;
    transition: all 0.3s ease;
  }

  .submenu-panel .back-btn:hover {
    color: #fff;
    text-shadow: 0 0 10px var(--cyan);
  }

  .submenu-panel .back-btn i {
    transition: transform 0.3s ease;
  }

  .submenu-panel .back-btn:hover i {
    transform: translateX(-4px);
  }

  .submenu-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 30px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255,45,111,0.2);
  }

  .submenu-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .submenu-item {
    padding: 12px 16px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.25s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .submenu-item:hover {
    color: #fff;
    background: rgba(255,45,111,0.08);
    padding-left: 22px;
  }

  .submenu-item.selected {
    color: var(--pink);
  }

  .submenu-item .check {
    color: var(--pink);
    font-size: 0.85em;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .submenu-item.selected .check {
    opacity: 1;
  }

  /* Slider */
  .slider-row {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .slider-label {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .slider-track {
    width: 140px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }

  .slider-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--orange));
    border-radius: 2px;
    width: var(--val, 70%);
    transition: width 0.15s ease;
  }

  .slider-thumb {
    position: absolute;
    top: 50%;
    left: var(--val, 70%);
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,45,111,0.5);
    transition: left 0.15s ease, transform 0.15s ease;
  }

  .slider-thumb:hover {
    transform: translate(-50%, -50%) scale(1.3);
  }

  .slider-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    color: var(--cyan);
    width: 36px;
    text-align: right;
  }

  /* === BOTTOM BAR === */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(0deg, rgba(6,6,14,0.8) 0%, transparent 100%);
  }

  .controls-hint {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .key-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 6px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.03);
  }

  .version-text {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.15);
    font-family: 'Orbitron', sans-serif;
  }

  /* === NOTIFICATION TOAST === */
  .toast {
    position: fixed;
    top: 30px;
    right: 30px;
    z-index: 200;
    padding: 14px 24px;
    background: linear-gradient(135deg, rgba(6,6,14,0.95), rgba(20,10,30,0.95));
    border: 1px solid rgba(255,45,111,0.3);
    border-left: 3px solid var(--pink);
    border-radius: 4px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.05em;
    color: var(--text);
    backdrop-filter: blur(20px);
    transform: translateX(120%);
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(255,45,111,0.1);
  }

  .toast.show {
    transform: translateX(0);
  }

  /* === LOADING SCREEN === */
  .loading-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--darker);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  .loading-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loading-bar-wrap {
    width: 280px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 30px;
  }

  .loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  .loading-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--muted);
    margin-top: 16px;
  }

  /* === FLICKER ANIMATION === */
  @keyframes flicker {
    0%, 97%, 100% { opacity: 1; }
    97.5% { opacity: 0.6; }
    98% { opacity: 1; }
    98.5% { opacity: 0.4; }
    99% { opacity: 1; }
  }

  .flicker {
    animation: flicker 5s infinite;
  }

  /* === DECORATIVE CORNER LINES === */
  .corner-decor {
    position: fixed;
    z-index: 15;
    pointer-events: none;
  }

  .corner-tl {
    top: 24px;
    left: 24px;
    width: 40px;
    height: 40px;
    border-top: 1px solid rgba(255,45,111,0.3);
    border-left: 1px solid rgba(255,45,111,0.3);
  }

  .corner-br {
    bottom: 60px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-bottom: 1px solid rgba(0,240,255,0.2);
    border-right: 1px solid rgba(0,240,255,0.2);
  }

  /* === AMBIENT GLOW BLOBS === */
  .glow-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 1;
    animation: blobDrift 15s ease-in-out infinite alternate;
  }

  @keyframes blobDrift {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -20px) scale(1.1); }
    100% { transform: translate(-20px, 15px) scale(0.95); }
  }

  /* === RESPONSIVE === */
  @media (max-width: 768px) {
    .menu-container { padding-left: 5%; }
    .menu-list { width: 90vw; }
    .bottom-bar { padding: 15px 5%; }
    .controls-hint { display: none; }
    .submenu-panel { width: 100vw; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="logo-glitch" data-text="GTA" style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:48px;color:#fff;letter-spacing:0.1em;">GTA</div>
  <div class="loading-bar-wrap">
    <div class="loading-bar" id="loadingBar"></div>
  </div>
  <div class="loading-text" id="loadingText">INITIALIZING</div>
</div>

<!-- Background Scene -->
<div class="bg-scene" id="bgScene">
  <div class="sky-gradient"></div>
  <div class="stars" id="stars"></div>
  <div class="sun"></div>
  <div class="sun-lines" id="sunLines"></div>
  <div class="skyline" id="skyline"></div>
  <div class="water">
    <div class="water-reflection"></div>
  </div>
  <div class="palm" style="left:5%;bottom:27%;"><div class="palm-trunk" style="--rot:-8deg;height:90px;"></div></div>
  <div class="palm" style="left:12%;bottom:27%;"><div class="palm-trunk" style="--rot:5deg;height:70px;"></div></div>
  <div class="palm" style="right:8%;bottom:27%;"><div class="palm-trunk" style="--rot:10deg;height:100px;"></div></div>
  <div class="palm" style="right:18%;bottom:27%;"><div class="palm-trunk" style="--rot:-6deg;height:65px;"></div></div>
</div>

<!-- Ambient Glow Blobs -->
<div class="glow-blob" style="width:300px;height:300px;background:rgba(255,45,111,0.06);top:20%;left:10%;"></div>
<div class="glow-blob" style="width:250px;height:250px;background:rgba(0,240,255,0.04);bottom:30%;right:15%;animation-delay:-7s;"></div>
<div class="glow-blob" style="width:200px;height:200px;background:rgba(180,77,255,0.05);top:50%;left:50%;animation-delay:-3s;"></div>

<!-- Bokeh Particles -->
<div class="bokeh-container" id="bokehContainer"></div>

<!-- Overlays -->
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="noise"></div>

<!-- Corner Decorations -->
<div class="corner-decor corner-tl"></div>
<div class="corner-decor corner-br"></div>

<!-- Main Menu -->
<main class="menu-container" id="menuContainer">
  <div class="logo-wrap">
    <div class="logo logo-glitch flicker" data-text="GTA">
      GTA<span class="roman">VI</span>
    </div>
    <div class="subtitle">Vice City</div>
  </div>

  <ul class="menu-list" id="menuList" role="menu">
    <li class="menu-item active" role="menuitem" data-submenu="story" tabindex="0">
      <span class="selector"></span>
      <span class="item-icon"><i class="fas fa-play"></i></span>
      Story Mode
      <span class="arrow"><i class="fas fa-chevron-right"></i></span>
    </li>
    <li class="menu-item" role="menuitem" data-submenu="online" tabindex="0">
      <span class="selector"></span>
      <span class="item-icon"><i class="fas fa-globe"></i></span>
      Online
      <span class="arrow"><i class="fas fa-chevron-right"></i></span>
    </li>
    <li class="menu-item" role="menuitem" data-submenu="settings" tabindex="0">
      <span class="selector"></span>
      <span class="item-icon"><i class="fas fa-sliders-h"></i></span>
      Settings
      <span class="arrow"><i class="fas fa-chevron-right"></i></span>
    </li>
    <li class="menu-item" role="menuitem" data-action="gallery" tabindex="0">
      <span class="selector"></span>
      <span class="item-icon"><i class="fas fa-images"></i></span>
      Gallery
      <span class="arrow"><i class="fas fa-chevron-right"></i></span>
    </li>
    <li class="menu-item" role="menuitem" data-action="map" tabindex="0">
      <span class="selector"></span>
      <span class="item-icon"><i class="fas fa-map-marked-alt"></i></span>
      Map
      <span class="arrow"><i class="fas fa-chevron-right"></i></span>
    </li>
    <li class="menu-item" role="menuitem" data-action="quit" tabindex="0">
      <span class="selector"></span>
      <span class="item-icon"><i class="fas fa-sign-out-alt"></i></span>
      Quit
      <span class="arrow"><i class="fas fa-chevron-right"></i></span>
    </li>
  </ul>
</main>

<!-- Submenu Panels -->
<div class="submenu-panel" id="submenuPanel" role="dialog" aria-label="Submenu">
  <button class="back-btn" id="backBtn" aria-label="Go back">
    <i class="fas fa-arrow-left"></i> Back
  </button>
  <div class="submenu-title" id="submenuTitle"></div>
  <div id="submenuContent"></div>
</div>

<!-- Bottom Bar -->
<footer class="bottom-bar">
  <div class="controls-hint">
    <div class="key-hint"><span class="key"><i class="fas fa-arrow-up"></i></span><span class="key"><i class="fas fa-arrow-down"></i></span> Navigate</div>
    <div class="key-hint"><span class="key">ENTER</span> Select</div>
    <div class="key-hint"><span class="key">ESC</span> Back</div>
  </div>
  <div class="version-text">BUILD 1.0.2847 // LEAKED EDITION</div>
</footer>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // === LOADING SCREEN ===
  const loadingBar = document.getElementById('loadingBar');
  const loadingText = document.getElementById('loadingText');
  const loadingScreen = document.getElementById('loadingScreen');
  const loadMessages = ['LOADING ASSETS', 'INITIALIZING RENDERER', 'BUILDING WORLD', 'SPAWNING VICE CITY', 'READY'];
  let loadProgress = 0;

  function animateLoading() {
    const interval = setInterval(() => {
      loadProgress += Math.random() * 12 + 3;
      if (loadProgress >= 100) {
        loadProgress = 100;
        loadingBar.style.width = '100%';
        loadingText.textContent = loadMessages[4];
        clearInterval(interval);
        setTimeout(() => loadingScreen.classList.add('hidden'), 400);
        return;
      }
      loadingBar.style.width = loadProgress + '%';
      const msgIdx = Math.min(Math.floor(loadProgress / 25), 3);
      loadingText.textContent = loadMessages[msgIdx];
    }, 120);
  }
  animateLoading();

  // === GENERATE STARS ===
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    star.style.animationDelay = -Math.random() * 5 + 's';
    star.style.width = (1 + Math.random() * 2) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
  }

  // === GENERATE SUN LINES ===
  const sunLines = document.getElementById('sunLines');
  for (let i = 0; i < 8; i++) {
    const line = document.createElement('span');
    line.style.animationDelay = -i * 0.5 + 's';
    line.style.opacity = 0.3 + (i * 0.08);
    sunLines.appendChild(line);
  }

  // === GENERATE BUILDINGS ===
  const skyline = document.getElementById('skyline');
  const buildingData = [
    { left: 2, w: 30, h: 50 }, { left: 5, w: 20, h: 80 }, { left: 8, w: 35, h: 60 },
    { left: 14, w: 18, h: 95 }, { left: 17, w: 40, h: 45 }, { left: 22, w: 25, h: 70 },
    { left: 27, w: 15, h: 110 }, { left: 30, w: 50, h: 40 }, { left: 36, w: 22, h: 85 },
    { left: 40, w: 35, h: 55 }, { left: 45, w: 12, h: 100 }, { left: 48, w: 45, h: 65 },
    { left: 54, w: 20, h: 90 }, { left: 58, w: 30, h: 50 }, { left: 63, w: 18, h: 75 },
    { left: 66, w: 40, h: 60 }, { left: 72, w: 25, h: 105 }, { left: 76, w: 35, h: 45 },
    { left: 82, w: 20, h: 80 }, { left: 85, w: 50, h: 55 }, { left: 91, w: 30, h: 70 },
    { left: 95, w: 22, h: 90 },
  ];
  buildingData.forEach(b => {
    const el = document.createElement('div');
    el.className = 'building';
    el.style.left = b.left + '%';
    el.style.width = b.w + 'px';
    el.style.height = b.h + 'px';
    skyline.appendChild(el);
  });

  // === GENERATE WATER LINES ===
  const water = document.querySelector('.water');
  for (let i = 0; i < 15; i++) {
    const wl = document.createElement('div');
    wl.className = 'water-line';
    wl.style.top = (5 + i * 6) + '%';
    wl.style.animationDelay = -i * 0.3 + 's';
    water.appendChild(wl);
  }

  // === GENERATE BOKEH ===
  const bokehContainer = document.getElementById('bokehContainer');
  const bokehColors = ['rgba(255,45,111,0.15)', 'rgba(0,240,255,0.12)', 'rgba(255,140,66,0.1)', 'rgba(180,77,255,0.1)', 'rgba(255,207,86,0.08)'];
  for (let i = 0; i < 20; i++) {
    const b = document.createElement('div');
    b.className = 'bokeh';
    const size = 4 + Math.random() * 20;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.top = Math.random() * 100 + '%';
    b.style.background = bokehColors[Math.floor(Math.random() * bokehColors.length)];
    b.style.filter = `blur(${2 + Math.random() * 4}px)`;
    b.style.setProperty('--dur', (8 + Math.random() * 12) + 's');
    b.style.setProperty('--o1', (0.2 + Math.random() * 0.3).toFixed(2));
    b.style.setProperty('--o2', (0.5 + Math.random() * 0.5).toFixed(2));
    b.style.setProperty('--dx1', (Math.random() * 60 - 30) + 'px');
    b.style.setProperty('--dy1', (Math.random() * 60 - 30) + 'px');
    b.style.setProperty('--dx2', (Math.random() * 60 - 30) + 'px');
    b.style.setProperty('--dy2', (Math.random() * 60 - 30) + 'px');
    b.style.setProperty('--dx3', (Math.random() * 60 - 30) + 'px');
    b.style.setProperty('--dy3', (Math.random() * 60 - 30) + 'px');
    b.style.animationDelay = -Math.random() * 10 + 's';
    bokehContainer.appendChild(b);
  }

  // === MENU LOGIC ===
  const menuItems = document.querySelectorAll('.menu-item');
  const submenuPanel = document.getElementById('submenuPanel');
  const backBtn = document.getElementById('backBtn');
  const submenuTitle = document.getElementById('submenuTitle');
  const submenuContent = document.getElementById('submenuContent');
  const toast = document.getElementById('toast');
  let activeIndex = 0;
  let submenuOpen = false;

  // Submenu data
  const submenuData = {
    story: {
      title: 'Story Mode',
      items: [
        { label: 'New Game', icon: 'fa-plus-circle', action: () => showToast('Starting new story...') },
        { label: 'Continue', icon: 'fa-forward', action: () => showToast('Loading save file...') },
        { label: 'Chapter Select', icon: 'fa-list-ol', action: () => showToast('Opening chapter select') },
        { label: 'Difficulty', icon: 'fa-tachometer-alt', type: 'options', options: ['Normal', 'Hard', 'Hardcore'], selected: 0 },
        { label: 'Rewind Missions', icon: 'fa-undo', action: () => showToast('Mission rewind unlocked') },
      ]
    },
    online: {
      title: 'GTA Online',
      items: [
        { label: 'Free Roam', icon: 'fa-street-view', action: () => showToast('Joining free roam session...') },
        { label: 'Race', icon: 'fa-flag-checkered', action: () => showToast('Finding race lobby...') },
        { label: 'Deathmatch', icon: 'fa-crosshairs', action: () => showToast('Matching deathmatch...') },
        { label: 'Heist', icon: 'fa-mask', action: () => showToast('Starting heist planning...') },
        { label: 'Private Session', icon: 'fa-lock', action: () => showToast('Creating private session') },
        { label: 'Creators', icon: 'fa-paint-brush', action: () => showToast('Opening creator tools') },
      ]
    },
    settings: {
      title: 'Settings',
      items: [
        { label: 'Display', icon: 'fa-desktop', type: 'slider', value: 75, unit: '%' },
        { label: 'Brightness', icon: 'fa-sun', type: 'slider', value: 60, unit: '%' },
        { label: 'Volume', icon: 'fa-volume-up', type: 'slider', value: 85, unit: '%' },
        { label: 'Music', icon: 'fa-music', type: 'slider', value: 70, unit: '%' },
        { label: 'Camera Sensitivity', icon: 'fa-video', type: 'slider', value: 50, unit: '%' },
        { label: 'Subtitles', icon: 'fa-closed-captioning', type: 'options', options: ['On', 'Off'], selected: 0 },
        { label: 'Language', icon: 'fa-language', type: 'options', options: ['English', 'Spanish', 'French', 'German', 'Japanese'], selected: 0 },
        { label: 'HUD', icon: 'fa-th', type: 'options', options: ['Full', 'Minimal', 'Hidden'], selected: 0 },
      ]
    }
  };

  function setActiveItem(index) {
    menuItems.forEach((item, i) => {
      item.classList.toggle('active', i === index);
    });
    activeIndex = index;
  }

  function openSubmenu(key) {
    const data = submenuData[key];
    if (!data) return;
    submenuTitle.textContent = data.title;
    submenuContent.innerHTML = '';

    data.items.forEach((item, idx) => {
      if (item.type === 'slider') {
        const row = document.createElement('div');
        row.className = 'slider-row';
        row.innerHTML = `
          <span class="slider-label"><i class="fas ${item.icon}" style="margin-right:10px;opacity:0.5;width:18px;text-align:center;"></i>${item.label}</span>
          <div class="slider-track" data-idx="${idx}" data-key="${key}">
            <div class="slider-fill" style="--val:${item.value}%"></div>
            <div class="slider-thumb" style="--val:${item.value}%"></div>
          </div>
          <span class="slider-value">${item.value}${item.unit}</span>
        `;
        submenuContent.appendChild(row);
      } else if (item.type === 'options') {
        const list = document.createElement('ul');
        list.className = 'submenu-list';
        const li = document.createElement('li');
        li.className = 'submenu-item';
        li.innerHTML = `
          <span><i class="fas ${item.icon}" style="margin-right:10px;opacity:0.5;width:18px;text-align:center;"></i>${item.label}</span>
          <span style="color:var(--cyan);font-size:14px;">${item.options[item.selected]} <i class="fas fa-chevron-right" style="margin-left:6px;font-size:10px;opacity:0.5;"></i></span>
        `;
        li.addEventListener('click', () => {
          item.selected = (item.selected + 1) % item.options.length;
          li.querySelector('span:last-child').innerHTML = `${item.options[item.selected]} <i class="fas fa-chevron-right" style="margin-left:6px;font-size:10px;opacity:0.5;"></i>`;
          showToast(`${item.label}: ${item.options[item.selected]}`);
        });
        list.appendChild(li);
        submenuContent.appendChild(list);
      } else {
        const list = document.createElement('ul');
        list.className = 'submenu-list';
        const li = document.createElement('li');
        li.className = 'submenu-item';
        li.innerHTML = `<span><i class="fas ${item.icon}" style="margin-right:10px;opacity:0.5;width:18px;text-align:center;"></i>${item.label}</span><span class="arrow" style="opacity:0.5;color:var(--muted);font-size:0.75em;"><i class="fas fa-chevron-right"></i></span>`;
        li.addEventListener('click', () => {
          if (item.action) item.action();
        });
        list.appendChild(li);
        submenuContent.appendChild(list);
      }
    });

    // Wire up sliders
    setTimeout(() => {
      document.querySelectorAll('.slider-track').forEach(track => {
        const fill = track.querySelector('.slider-fill');
        const thumb = track.querySelector('.slider-thumb');
        const valDisplay = track.parentElement.querySelector('.slider-value');
        const key = track.dataset.key;
        const idx = parseInt(track.dataset.idx);
        let dragging = false;

        function updateSlider(e) {
          const rect = track.getBoundingClientRect();
          let pct = ((e.clientX - rect.left) / rect.width) * 100;
          pct = Math.max(0, Math.min(100, Math.round(pct)));
          fill.style.setProperty('--val', pct + '%');
          thumb.style.setProperty('--val', pct + '%');
          valDisplay.textContent = pct + submenuData[key].items[idx].unit;
          submenuData[key].items[idx].value = pct;
        }

        track.addEventListener('mousedown', (e) => { dragging = true; updateSlider(e); });
        window.addEventListener('mousemove', (e) => { if (dragging) updateSlider(e); });
        window.addEventListener('mouseup', () => { dragging = false; });
        track.addEventListener('touchstart', (e) => { dragging = true; updateSlider(e.touches[0]); }, { passive: true });
        window.addEventListener('touchmove', (e) => { if (dragging) updateSlider(e.touches[0]); }, { passive: true });
        window.addEventListener('touchend', () => { dragging = false; });
      });
    }, 50);

    submenuPanel.classList.add('open');
    submenuOpen = true;
  }

  function closeSubmenu() {
    submenuPanel.classList.remove('open');
    submenuOpen = false;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // Click handlers
  menuItems.forEach((item, i) => {
    item.addEventListener('click', () => {
      setActiveItem(i);
      const submenu = item.dataset.submenu;
      const action = item.dataset.action;
      if (submenu) {
        openSubmenu(submenu);
      } else if (action === 'gallery') {
        showToast('Opening gallery — 47 screenshots found');
      } else if (action === 'map') {
        showToast('Loading Vice City map...');
      } else if (action === 'quit') {
        showToast('See you in Vice City, tomboy...');
      }
    });
  });

  backBtn.addEventListener('click', closeSubmenu);

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (loadingScreen && !loadingScreen.classList.contains('hidden')) return;

    if (submenuOpen) {
      if (e.key === 'Escape' || e.key === 'Backspace') {
        e.preventDefault();
        closeSubmenu();
      }
      return;
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActiveItem((activeIndex - 1 + menuItems.length) % menuItems.length);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActiveItem((activeIndex + 1) % menuItems.length);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      menuItems[activeIndex].click();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeSubmenu();
    }
  });

  // Mouse parallax on background
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;
    const bg = document.getElementById('bgScene');
    bg.style.transform = `translate(${x * -8}px, ${y * -5}px)`;
  });

  // Periodic glitch burst on logo
  const logoEl = document.querySelector('.logo.logo-glitch');
  setInterval(() => {
    if (Math.random() > 0.7) {
      logoEl.style.textShadow = `
        ${Math.random()*10-5}px ${Math.random()*4-2}px 0 rgba(0,240,255,0.7),
        ${Math.random()*-10+5}px ${Math.random()*-4+2}px 0 rgba(255,45,111,0.7)
      `;
      setTimeout(() => {
        logoEl.style.textShadow = '0 0 20px rgba(255,45,111,0.5), 0 0 60px rgba(255,45,111,0.2)';
      }, 100 + Math.random() * 100);
    }
  }, 2000);
</script>
</body>
</html>
