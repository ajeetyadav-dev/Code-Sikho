<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squid Game — Vote</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Outfit:wght@200;400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #08080e;
    --bg-card: #111118;
    --fg: #f0ede6;
    --muted: #5a5870;
    --accent-pink: #e8364f;
    --accent-pink-glow: rgba(232, 54, 79, 0.35);
    --accent-teal: #00d4aa;
    --accent-teal-glow: rgba(0, 212, 170, 0.25);
    --gold: #f5c542;
    --border: #1e1d2a;
    --card: #151520;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .font-display { font-family: 'Black Han Sans', sans-serif; }

  /* Background atmosphere */
  .bg-atmosphere {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(232,54,79,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(0,212,170,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 10% 60%, rgba(232,54,79,0.03) 0%, transparent 50%);
  }

  /* Floating shapes */
  .shape-float {
    position: fixed;
    opacity: 0.04;
    z-index: 0;
    pointer-events: none;
    animation: shapeDrift 20s ease-in-out infinite;
  }
  .shape-float:nth-child(2) { animation-delay: -7s; animation-duration: 25s; }
  .shape-float:nth-child(3) { animation-delay: -13s; animation-duration: 18s; }

  @keyframes shapeDrift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    33% { transform: translateY(-30px) rotate(15deg); }
    66% { transform: translateY(20px) rotate(-10deg); }
  }

  /* Geometric symbols */
  .symbol-circle {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid var(--accent-pink);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .symbol-triangle {
    width: 0; height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-bottom: 22px solid var(--accent-pink);
    display: inline-block;
  }
  .symbol-square {
    width: 22px; height: 22px;
    border: 2.5px solid var(--accent-pink);
    display: inline-block;
  }

  /* Player card */
  .player-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
  }
  .player-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(232,54,79,0.06) 0%, transparent 50%);
    opacity: 0; transition: opacity 0.3s;
  }
  .player-card:hover::before { opacity: 1; }
  .player-card:hover {
    border-color: rgba(232,54,79,0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .player-card.voted-o { border-color: var(--accent-teal); }
  .player-card.voted-x { border-color: var(--accent-pink); }
  .player-card.eliminated {
    opacity: 0.35;
    filter: grayscale(0.8);
    pointer-events: none;
  }
  .player-card.eliminated::after {
    content: '✕';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    color: var(--accent-pink);
    opacity: 0.6;
  }

  .player-number {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.75rem;
    line-height: 1;
    color: var(--muted);
    transition: color 0.3s;
  }
  .player-card:hover .player-number { color: var(--fg); }
  .player-card.voted-o .player-number { color: var(--accent-teal); }
  .player-card.voted-x .player-number { color: var(--accent-pink); }

  /* Vote badge */
  .vote-badge {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px;
    opacity: 0; transform: scale(0);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .vote-badge.show { opacity: 1; transform: scale(1); }
  .vote-badge.badge-o {
    background: var(--accent-teal); color: var(--bg);
    box-shadow: 0 0 16px var(--accent-teal-glow);
  }
  .vote-badge.badge-x {
    background: var(--accent-pink); color: #fff;
    box-shadow: 0 0 16px var(--accent-pink-glow);
  }

  /* Vote buttons */
  .vote-btn {
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 3px solid;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 2.5rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .vote-btn::after {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 1px solid;
    opacity: 0;
    transition: all 0.3s;
  }
  .vote-btn:hover::after { opacity: 0.4; }

  .btn-o {
    border-color: var(--accent-teal);
    color: var(--accent-teal);
  }
  .btn-o::after { border-color: var(--accent-teal); }
  .btn-o:hover {
    background: rgba(0,212,170,0.12);
    box-shadow: 0 0 40px var(--accent-teal-glow), inset 0 0 20px rgba(0,212,170,0.08);
    transform: scale(1.08);
  }
  .btn-o:active { transform: scale(0.95); }

  .btn-x {
    border-color: var(--accent-pink);
    color: var(--accent-pink);
  }
  .btn-x::after { border-color: var(--accent-pink); }
  .btn-x:hover {
    background: rgba(232,54,79,0.12);
    box-shadow: 0 0 40px var(--accent-pink-glow), inset 0 0 20px rgba(232,54,79,0.08);
    transform: scale(1.08);
  }
  .btn-x:active { transform: scale(0.95); }

  .vote-btn:disabled {
    opacity: 0.2; cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }
  .vote-btn:disabled::after { display: none; }

  /* Progress bar */
  .vote-bar-track {
    height: 10px; border-radius: 5px;
    background: var(--border); overflow: hidden;
    position: relative;
  }
  .vote-bar-fill {
    height: 100%; border-radius: 5px;
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }
  .vote-bar-fill.fill-o {
    background: linear-gradient(90deg, var(--accent-teal), #00e8bb);
    box-shadow: 0 0 12px var(--accent-teal-glow);
  }
  .vote-bar-fill.fill-x {
    background: linear-gradient(90deg, #ff4466, var(--accent-pink));
    box-shadow: 0 0 12px var(--accent-pink-glow);
  }

  /* Pulse ring on vote */
  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(2.5); opacity: 0; }
  }
  .pulse-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid;
    animation: pulseRing 0.7s ease-out forwards;
    pointer-events: none;
  }

  /* Toast notification */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px);
    padding: 14px 28px; border-radius: 12px;
    font-weight: 600; font-size: 0.95rem;
    z-index: 1000;
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    backdrop-filter: blur(16px);
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
  .toast-o {
    background: rgba(0,212,170,0.15); border: 1px solid rgba(0,212,170,0.3);
    color: var(--accent-teal);
  }
  .toast-x {
    background: rgba(232,54,79,0.15); border: 1px solid rgba(232,54,79,0.3);
    color: var(--accent-pink);
  }

  /* Scanline overlay */
  .scanlines {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }

  /* Section title decoration */
  .section-line {
    height: 1px; flex: 1;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .section-line.right {
    background: linear-gradient(270deg, var(--border), transparent);
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(8,8,14,0.92);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-content {
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .modal-overlay.show .modal-content { transform: scale(1); }

  /* Timer */
  .timer-digit {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 3rem;
    color: var(--accent-pink);
    text-shadow: 0 0 20px var(--accent-pink-glow);
    min-width: 2ch;
    text-align: center;
  }
  .timer-separator {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 3rem;
    color: var(--muted);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* Particle canvas */
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Responsive */
  @media (max-width: 768px) {
    .vote-btn { width: 76px; height: 76px; font-size: 1.8rem; }
    .timer-digit { font-size: 2rem; }
    .timer-separator { font-size: 2rem; }
    .player-number { font-size: 1.3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg-atmosphere"></div>
<canvas id="particles"></canvas>
<div class="scanlines"></div>

<!-- Floating shapes -->
<svg class="shape-float" style="top:10%;left:8%;width:120px" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40" fill="none" stroke="#e8364f" stroke-width="2"/>
</svg>
<svg class="shape-float" style="top:60%;right:5%;width:100px" viewBox="0 0 100 100">
  <polygon points="50,10 90,85 10,85" fill="none" stroke="#e8364f" stroke-width="2"/>
</svg>
<svg class="shape-float" style="bottom:15%;left:15%;width:90px" viewBox="0 0 100 100">
  <rect x="15" y="15" width="70" height="70" fill="none" stroke="#e8364f" stroke-width="2"/>
</svg>

<!-- Main content -->
<div class="relative z-10 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="px-6 py-5 flex items-center justify-between border-b" style="border-color:var(--border)">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="symbol-circle"></span>
        <span class="symbol-triangle"></span>
        <span class="symbol-square"></span>
      </div>
      <h1 class="font-display text-xl tracking-wide" style="color:var(--fg)">SQUID GAME</h1>
    </div>
    <!-- Timer -->
    <div class="flex items-center gap-1" id="timerDisplay">
      <span class="timer-digit" id="timerMin">05</span>
      <span class="timer-separator">:</span>
      <span class="timer-digit" id="timerSec">00</span>
    </div>
    <div class="flex items-center gap-3 text-sm" style="color:var(--muted)">
      <span>Round <strong style="color:var(--fg)">3</strong></span>
      <span style="color:var(--border)">|</span>
      <span><i class="fa-solid fa-users" style="color:var(--accent-pink);margin-right:4px"></i> <span id="aliveCount">0</span> alive</span>
    </div>
  </header>

  <main class="flex-1 flex flex-col lg:flex-row">

    <!-- Player grid -->
    <section class="flex-1 p-6 lg:p-8">
      <div class="flex items-center gap-4 mb-6">
        <div class="section-line"></div>
        <h2 class="text-sm font-semibold tracking-widest uppercase" style="color:var(--muted)">Players</h2>
        <div class="section-line right"></div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3" id="playerGrid">
        <!-- Filled by JS -->
      </div>
    </section>

    <!-- Voting panel -->
    <aside class="lg:w-[380px] border-t lg:border-t-0 lg:border-l p-6 lg:p-8 flex flex-col" style="border-color:var(--border);background:rgba(17,17,24,0.6);backdrop-filter:blur(8px)">

      <!-- Current voter info -->
      <div class="text-center mb-8">
        <p class="text-xs tracking-widest uppercase mb-2" style="color:var(--muted)">Now Voting</p>
        <div class="flex items-center justify-center gap-3 mb-3">
          <span class="player-number text-5xl" id="currentPlayerNumber" style="color:var(--fg)">456</span>
        </div>
        <p class="text-sm" style="color:var(--muted)" id="currentPlayerName">Seong Gi-hun</p>
      </div>

      <!-- O / X Buttons -->
      <div class="flex items-center justify-center gap-10 mb-8">
        <div class="text-center">
          <button class="vote-btn btn-o" id="btnO" onclick="castVote('O')" aria-label="Vote O — Continue the game">
            O
            <span class="pulse-ring" style="border-color:var(--accent-teal);display:none"></span>
          </button>
          <p class="text-xs mt-3 tracking-wider uppercase" style="color:var(--accent-teal)">Continue</p>
        </div>
        <div class="text-center">
          <button class="vote-btn btn-x" id="btnX" onclick="castVote('X')" aria-label="Vote X — End the game">
            X
            <span class="pulse-ring" style="border-color:var(--accent-pink);display:none"></span>
          </button>
          <p class="text-xs mt-3 tracking-wider uppercase" style="color:var(--accent-pink)">End Game</p>
        </div>
      </div>

      <!-- Divider -->
      <div class="h-px mb-6" style="background:var(--border)"></div>

      <!-- Results -->
      <div class="mb-6">
        <div class="flex justify-between items-center mb-3">
          <span class="text-sm font-semibold" style="color:var(--accent-teal)">
            O <span id="countO" class="ml-1">0</span>
          </span>
          <span class="text-xs" style="color:var(--muted)" id="votedCount">0 / 0 voted</span>
          <span class="text-sm font-semibold" style="color:var(--accent-pink)">
            <span id="countX" class="mr-1">0</span> X
          </span>
        </div>
        <div class="vote-bar-track">
          <div class="vote-bar-fill fill-o" id="barO" style="width:50%"></div>
        </div>
        <div class="vote-bar-track mt-1">
          <div class="vote-bar-fill fill-x" id="barX" style="width:50%"></div>
        </div>
      </div>

      <!-- Recent votes log -->
      <div class="flex-1 min-h-0">
        <p class="text-xs tracking-widest uppercase mb-3" style="color:var(--muted)">Vote Log</p>
        <div class="space-y-2 overflow-y-auto max-h-[200px] pr-1" id="voteLog" style="scrollbar-width:thin">
          <p class="text-xs italic" style="color:var(--muted)">Waiting for first vote...</p>
        </div>
      </div>

      <!-- Auto / Skip controls -->
      <div class="mt-6 flex gap-3">
        <button class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all" id="btnAutoVote"
          style="background:var(--card);border:1px solid var(--border);color:var(--muted)"
          onmouseover="this.style.borderColor='rgba(232,54,79,0.4)';this.style.color='var(--fg)'"
          onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'"
          onclick="toggleAutoVote()">
          <i class="fa-solid fa-forward-fast mr-1"></i> Auto Vote
        </button>
        <button class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all"
          style="background:var(--card);border:1px solid var(--border);color:var(--muted)"
          onmouseover="this.style.borderColor='rgba(232,54,79,0.4)';this.style.color='var(--fg)'"
          onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'"
          onclick="resetVoting()">
          <i class="fa-solid fa-rotate-right mr-1"></i> Reset
        </button>
      </div>

    </aside>
  </main>
</div>

<!-- Result modal -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-content">
    <div class="flex items-center justify-center gap-4 mb-6">
      <span class="symbol-circle" style="width:36px;height:36px;border-width:3px"></span>
      <span class="symbol-triangle" style="transform:scale(1.5)"></span>
      <span class="symbol-square" style="width:32px;height:32px;border-width:3px"></span>
    </div>
    <h2 class="font-display text-4xl mb-3" id="resultTitle" style="color:var(--fg)">VOTING COMPLETE</h2>
    <p class="text-lg mb-6" id="resultText" style="color:var(--muted)"></p>
    <div class="flex items-center justify-center gap-8 mb-8">
      <div class="text-center">
        <p class="font-display text-5xl" id="resultO" style="color:var(--accent-teal)">0</p>
        <p class="text-xs uppercase tracking-wider mt-1" style="color:var(--muted)">Continue</p>
      </div>
      <div class="text-3xl" style="color:var(--border)">vs</div>
      <div class="text-center">
        <p class="font-display text-5xl" id="resultX" style="color:var(--accent-pink)">0</p>
        <p class="text-xs uppercase tracking-wider mt-1" style="color:var(--muted)">End Game</p>
      </div>
    </div>
    <button class="px-8 py-3 rounded-lg font-semibold text-sm transition-all"
      style="background:var(--accent-pink);color:#fff"
      onmouseover="this.style.boxShadow='0 0 30px var(--accent-pink-glow)'"
      onmouseout="this.style.boxShadow='none'"
      onclick="closeModal()">
      Play Again
    </button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// === Player Data ===
const PLAYERS = [
  { id: 1,   name: 'Oh Il-nam',       eliminated: true  },
  { id: 456, name: 'Seong Gi-hun',    eliminated: false },
  { id: 218, name: 'Cho Sang-woo',    eliminated: false },
  { id: 067, name: 'Kang Sae-byeok',  eliminated: false },
  { id: 199, name: 'Abdul Ali',       eliminated: false },
  { id: 101, name: 'Jang Deok-su',    eliminated: true  },
  { id: 067, name: 'Kang Sae-byeok',  eliminated: false },
  { id: 001, name: 'The Recruiter',   eliminated: false },
  { id: 120, name: 'Han Mi-nyeo',     eliminated: true  },
  { id: 278, name: 'Park Min-su',     eliminated: false },
  { id: 333, name: 'Lee Myung-gi',    eliminated: false },
  { id: 124, name: 'Cho Gye-hun',     eliminated: false },
  { id: 095, name: 'Yoon Ji-woo',     eliminated: false },
  { id: 044, name: 'Seon Hye-jin',    eliminated: false },
  { id: 380, name: 'Roh Jae-won',     eliminated: false },
  { id: 222, name: 'Kim Jeong-rae',   eliminated: false },
  { id: 322, name: 'Yong-sik',        eliminated: false },
  { id: 007, name: 'Jung Jun-hee',    eliminated: false },
  { id: 149, name: 'Lee Eun-ji',      eliminated: false },
  { id: 011, name: 'Noh Jae-geun',    eliminated: false },
  { id: 234, name: 'Choi Su-bong',    eliminated: false },
  { id: 388, name: 'Park Sung-hoon',  eliminated: false },
  { id: 166, name: 'Rim Hyun-ju',     eliminated: false },
  { id: 099, name: 'Kim Young-tak',   eliminated: false },
  { id: 289, name: 'Jo Yu-ri',        eliminated: false },
];

// State
let votes = {};          // playerId -> 'O' | 'X'
let currentVoterIndex = 0;
let eligiblePlayers = [];
let timerSeconds = 300;  // 5 minutes
let timerInterval = null;
let autoVoting = false;
let autoInterval = null;

// Initialize
function init() {
  eligiblePlayers = PLAYERS.filter(p => !p.eliminated);
  // Fix duplicate 067 — keep only one
  const seen = new Set();
  eligiblePlayers = eligiblePlayers.filter(p => {
    if (seen.has(p.id)) return false;
    seen.add(p.id);
    return true;
  });

  votes = {};
  currentVoterIndex = 0;
  timerSeconds = 300;
  autoVoting = false;
  if (autoInterval) clearInterval(autoInterval);
  if (timerInterval) clearInterval(timerInterval);

  document.getElementById('btnAutoVote').style.borderColor = 'var(--border)';
  document.getElementById('btnAutoVote').style.color = 'var(--muted)';

  renderPlayerGrid();
  updateCurrentVoter();
  updateResults();
  updateAliveCount();
  startTimer();
  clearVoteLog();
  enableButtons();
}

function renderPlayerGrid() {
  const grid = document.getElementById('playerGrid');
  grid.innerHTML = '';
  PLAYERS.forEach(player => {
    const card = document.createElement('div');
    card.className = 'player-card' + (player.eliminated ? ' eliminated' : '');
    card.id = `card-${player.id}`;

    const vote = votes[player.id];
    if (vote === 'O') card.classList.add('voted-o');
    if (vote === 'X') card.classList.add('voted-x');

    card.innerHTML = `
      <div class="vote-badge ${vote ? 'show' : ''} ${vote === 'O' ? 'badge-o' : vote === 'X' ? 'badge-x' : ''}">${vote || ''}</div>
      <div class="player-number">${String(player.id).padStart(3, '0')}</div>
      <p class="text-xs mt-1.5 truncate" style="color:var(--muted)">${player.name}</p>
      ${player.eliminated ? '<p class="text-xs mt-1" style="color:var(--accent-pink)">Eliminated</p>' : ''}
    `;
    grid.appendChild(card);
  });
}

function updateCurrentVoter() {
  if (currentVoterIndex >= eligiblePlayers.length) {
    finishVoting();
    return;
  }
  const player = eligiblePlayers[currentVoterIndex];
  document.getElementById('currentPlayerNumber').textContent = String(player.id).padStart(3, '0');
  document.getElementById('currentPlayerName').textContent = player.name;
}

function castVote(choice) {
  if (currentVoterIndex >= eligiblePlayers.length) return;
  const player = eligiblePlayers[currentVoterIndex];
  if (votes[player.id]) return; // already voted

  votes[player.id] = choice;

  // Pulse animation on button
  const btn = choice === 'O' ? document.getElementById('btnO') : document.getElementById('btnX');
  const ring = btn.querySelector('.pulse-ring');
  ring.style.display = 'block';
  setTimeout(() => { ring.style.display = 'none'; }, 700);

  // Update card
  const card = document.getElementById(`card-${player.id}`);
  if (card) {
    card.classList.add(choice === 'O' ? 'voted-o' : 'voted-x');
    const badge = card.querySelector('.vote-badge');
    badge.className = `vote-badge show ${choice === 'O' ? 'badge-o' : 'badge-x'}`;
    badge.textContent = choice;
  }

  // Log
  addVoteLog(player, choice);
  showToast(`${String(player.id).padStart(3,'0')} voted ${choice}`, choice === 'O' ? 'toast-o' : 'toast-x');

  // Update results
  updateResults();

  // Next voter
  currentVoterIndex++;
  updateCurrentVoter();

  if (currentVoterIndex >= eligiblePlayers.length) {
    setTimeout(finishVoting, 600);
  }
}

function updateResults() {
  const totalEligible = eligiblePlayers.length;
  let oCount = 0, xCount = 0;
  Object.values(votes).forEach(v => { if (v === 'O') oCount++; if (v === 'X') xCount++; });
  const voted = oCount + xCount;

  document.getElementById('countO').textContent = oCount;
  document.getElementById('countX').textContent = xCount;
  document.getElementById('votedCount').textContent = `${voted} / ${totalEligible} voted`;

  if (voted === 0) {
    document.getElementById('barO').style.width = '50%';
    document.getElementById('barX').style.width = '50%';
  } else {
    document.getElementById('barO').style.width = (oCount / voted * 100) + '%';
    document.getElementById('barX').style.width = (xCount / voted * 100) + '%';
  }
}

function updateAliveCount() {
  document.getElementById('aliveCount').textContent = eligiblePlayers.length;
}

function addVoteLog(player, choice) {
  const log = document.getElementById('voteLog');
  // Remove placeholder
  if (log.children.length === 1 && log.children[0].tagName === 'P') {
    log.innerHTML = '';
  }
  const entry = document.createElement('div');
  entry.className = 'flex items-center gap-2 text-xs py-1.5 px-2 rounded-lg';
  entry.style.background = choice === 'O' ? 'rgba(0,212,170,0.06)' : 'rgba(232,54,79,0.06)';
  entry.style.animation = 'fadeIn 0.3s ease';
  entry.innerHTML = `
    <span style="color:${choice === 'O' ? 'var(--accent-teal)' : 'var(--accent-pink)'};font-weight:800">${choice}</span>
    <span style="color:var(--fg)">${String(player.id).padStart(3,'0')}</span>
    <span style="color:var(--muted)">${player.name}</span>
  `;
  log.prepend(entry);
}

function clearVoteLog() {
  document.getElementById('voteLog').innerHTML = '<p class="text-xs italic" style="color:var(--muted)">Waiting for first vote...</p>';
}

function showToast(message, className) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast ${className} show`;
  setTimeout(() => { toast.classList.remove('show'); }, 1800);
}

function enableButtons() {
  document.getElementById('btnO').disabled = false;
  document.getElementById('btnX').disabled = false;
}
function disableButtons() {
  document.getElementById('btnO').disabled = true;
  document.getElementById('btnX').disabled = true;
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      finishVoting();
      return;
    }
    timerSeconds--;
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    document.getElementById('timerMin').textContent = String(m).padStart(2, '0');
    document.getElementById('timerSec').textContent = String(s).padStart(2, '0');

    // Urgency color when < 30s
    if (timerSeconds <= 30) {
      document.getElementById('timerMin').style.color = '#ff4466';
      document.getElementById('timerSec').style.color = '#ff4466';
    } else {
      document.getElementById('timerMin').style.color = 'var(--accent-pink)';
      document.getElementById('timerSec').style.color = 'var(--accent-pink)';
    }
  }, 1000);
}

function toggleAutoVote() {
  autoVoting = !autoVoting;
  const btn = document.getElementById('btnAutoVote');
  if (autoVoting) {
    btn.style.borderColor = 'var(--accent-pink)';
    btn.style.color = 'var(--accent-pink)';
    btn.innerHTML = '<i class="fa-solid fa-pause mr-1"></i> Pause';
    autoInterval = setInterval(() => {
      if (currentVoterIndex >= eligiblePlayers.length) {
        clearInterval(autoInterval);
        autoVoting = false;
        return;
      }
      // Simulate somewhat realistic votes — some O, some X
      const player = eligiblePlayers[currentVoterIndex];
      // Certain players lean certain ways for flavor
      const leanX = [218, 101, 120, 333]; 
      const leanO = [456, 199, 067, 278]; 
      let choice;
      if (leanX.includes(player.id)) choice = Math.random() < 0.75 ? 'X' : 'O';
      else if (leanO.includes(player.id)) choice = Math.random() < 0.8 ? 'O' : 'X';
      else choice = Math.random() < 0.55 ? 'O' : 'X';
      castVote(choice);
    }, 800);
  } else {
    btn.style.borderColor = 'var(--border)';
    btn.style.color = 'var(--muted)';
    btn.innerHTML = '<i class="fa-solid fa-forward-fast mr-1"></i> Auto Vote';
    if (autoInterval) clearInterval(autoInterval);
  }
}

function finishVoting() {
  disableButtons();
  if (timerInterval) clearInterval(timerInterval);
  if (autoInterval) clearInterval(autoInterval);
  autoVoting = false;

  let oCount = 0, xCount = 0;
  Object.values(votes).forEach(v => { if (v === 'O') oCount++; if (v === 'X') xCount++; });

  document.getElementById('resultO').textContent = oCount;
  document.getElementById('resultX').textContent = xCount;

  if (oCount > xCount) {
    document.getElementById('resultTitle').textContent = 'THE GAME CONTINUES';
    document.getElementById('resultTitle').style.color = 'var(--accent-teal)';
    document.getElementById('resultText').textContent = `By a vote of ${oCount} to ${xCount}, the players chose to continue.`;
  } else if (xCount > oCount) {
    document.getElementById('resultTitle').textContent = 'THE GAME ENDS';
    document.getElementById('resultTitle').style.color = 'var(--accent-pink)';
    document.getElementById('resultText').textContent = `By a vote of ${xCount} to ${oCount}, the players chose to end the game.`;
  } else {
    document.getElementById('resultTitle').textContent = 'TIED VOTE';
    document.getElementById('resultTitle').style.color = 'var(--gold)';
    document.getElementById('resultText').textContent = `The vote is tied at ${oCount} each. The deciding vote falls to the majority.`;
  }

  setTimeout(() => {
    document.getElementById('resultModal').classList.add('show');
  }, 400);
}

function closeModal() {
  document.getElementById('resultModal').classList.remove('show');
  setTimeout(init, 400);
}

function resetVoting() {
  init();
  showToast('Voting has been reset', 'toast-o');
}

// === Particle System ===
(function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h;
  const particles = [];
  const PARTICLE_COUNT = 50;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Create particles
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.5 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      color: Math.random() > 0.6 ? 'rgba(232,54,79,' : 'rgba(0,212,170,',
      alpha: Math.random() * 0.3 + 0.05,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.02 + 0.005,
    });
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.pulse += p.pulseSpeed;

      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
      if (p.y < -10) p.y = h + 10;
      if (p.y > h + 10) p.y = -10;

      const a = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.1, p.r), 0, Math.PI * 2);
      ctx.fillStyle = p.color + a + ')';
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
})();

// Add fadeIn keyframe dynamically
const styleSheet = document.createElement('style');
styleSheet.textContent = `@keyframes fadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }`;
document.head.appendChild(styleSheet);

// Start
init();
</script>
