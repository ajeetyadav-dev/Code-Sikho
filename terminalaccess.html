<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL ACCESS</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --green: #00ff41;
    --green-dim: #00aa2a;
    --green-dark: #003b00;
    --red: #ff0033;
    --red-dim: #880011;
    --amber: #ffaa00;
    --bg: #0a0a0a;
    --bg-terminal: #050a05;
    --glow-green: 0 0 10px #00ff4180, 0 0 40px #00ff4120;
    --glow-red: 0 0 10px #ff003380, 0 0 40px #ff003320;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Matrix rain canvas */
  #matrixCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.15;
  }

  /* Scanline overlay */
  .scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1000;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
  }

  /* CRT flicker */
  .crt-flicker {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 999;
    pointer-events: none;
    animation: flicker 0.15s infinite alternate;
  }

  @keyframes flicker {
    0% { opacity: 0.97; }
    100% { opacity: 1; }
  }

  /* Vignette */
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 998;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
  }

  /* Main terminal container */
  .terminal-wrapper {
    position: relative;
    z-index: 10;
    width: 95%;
    max-width: 1100px;
    height: 90vh;
    max-height: 750px;
    border: 1px solid var(--green-dim);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--glow-green), inset 0 0 60px rgba(0,255,65,0.03);
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .top-bar {
    background: linear-gradient(90deg, #0d1a0d, #0a120a);
    border-bottom: 1px solid var(--green-dark);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .top-bar-dots {
    display: flex;
    gap: 6px;
  }

  .top-bar-dots span {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-red { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot-amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }

  .top-bar-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--green);
    text-shadow: 0 0 8px var(--green);
  }

  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 10px;
    color: var(--green-dim);
    letter-spacing: 1px;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
    animation: pulse-dot 1s infinite;
  }

  .status-dot.connected {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Side panel */
  .terminal-body {
    display: flex;
    flex: 1;
    overflow: hidden;
    background: var(--bg-terminal);
  }

  .side-panel {
    width: 200px;
    border-right: 1px solid var(--green-dark);
    padding: 12px 0;
    flex-shrink: 0;
    overflow-y: auto;
    background: linear-gradient(180deg, #060e06, #040804);
  }

  .side-section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--green-dim);
    padding: 8px 14px 4px;
    text-transform: uppercase;
  }

  .side-item {
    padding: 6px 14px;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    border-left: 2px solid transparent;
  }

  .side-item:hover {
    background: rgba(0,255,65,0.05);
    border-left-color: var(--green-dim);
  }

  .side-item.active {
    background: rgba(0,255,65,0.08);
    border-left-color: var(--green);
    color: #fff;
  }

  .side-item i {
    width: 14px;
    text-align: center;
    font-size: 10px;
  }

  .side-item .badge {
    margin-left: auto;
    background: var(--red);
    color: #fff;
    font-size: 8px;
    padding: 1px 5px;
    border-radius: 2px;
    font-family: 'Orbitron', sans-serif;
  }

  /* Main terminal area */
  .main-terminal {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .terminal-output {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.7;
    scroll-behavior: smooth;
  }

  .terminal-output::-webkit-scrollbar { width: 4px; }
  .terminal-output::-webkit-scrollbar-track { background: transparent; }
  .terminal-output::-webkit-scrollbar-thumb { background: var(--green-dark); border-radius: 2px; }

  .line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
  .line.system { color: var(--green-dim); }
  .line.error { color: var(--red); text-shadow: 0 0 6px rgba(255,0,51,0.3); }
  .line.warning { color: var(--amber); }
  .line.success { color: var(--green); text-shadow: 0 0 6px rgba(0,255,65,0.3); }
  .line.info { color: #00ccff; }
  .line.white { color: #cccccc; }
  .line.dim { color: #335533; }

  .highlight { color: #fff; font-weight: bold; }
  .highlight-red { color: var(--red); font-weight: bold; }
  .highlight-green { color: var(--green); font-weight: bold; }
  .highlight-amber { color: var(--amber); font-weight: bold; }

  /* Glitch text effect */
  .glitch {
    position: relative;
    display: inline-block;
    animation: glitch-shift 3s infinite;
  }

  @keyframes glitch-shift {
    0%, 92%, 100% { transform: none; }
    93% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
    94% { transform: translate(2px, -1px); }
    95% { transform: translate(-1px, -2px); filter: hue-rotate(0deg); }
    96% { transform: translate(1px, 2px); }
  }

  /* Progress bar */
  .progress-container {
    margin: 6px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-bar-outer {
    flex: 1;
    height: 8px;
    background: var(--green-dark);
    border: 1px solid #004400;
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar-inner {
    height: 100%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    width: 0%;
    transition: width 0.3s ease;
    position: relative;
  }

  .progress-bar-inner.danger {
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  .progress-bar-inner.amber {
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
  }

  .progress-pct {
    font-size: 11px;
    min-width: 38px;
    text-align: right;
    color: var(--green);
  }

  /* ASCII art */
  .ascii-art {
    color: var(--green-dim);
    font-size: 9px;
    line-height: 1.1;
    margin: 8px 0;
  }

  /* Input area */
  .input-area {
    border-top: 1px solid var(--green-dark);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,10,0,0.8);
    flex-shrink: 0;
  }

  .prompt-symbol {
    color: var(--green);
    font-weight: bold;
    font-size: 14px;
    text-shadow: 0 0 8px var(--green);
    flex-shrink: 0;
  }

  .terminal-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    caret-color: var(--green);
  }

  .terminal-input::placeholder {
    color: #1a3a1a;
  }

  /* Bottom status bar */
  .bottom-bar {
    background: linear-gradient(90deg, #0d1a0d, #0a120a);
    border-top: 1px solid var(--green-dark);
    padding: 4px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9px;
    color: var(--green-dim);
    letter-spacing: 1px;
    flex-shrink: 0;
    font-family: 'Orbitron', sans-serif;
  }

  .bottom-bar-section {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .bottom-bar-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Screen shake */
  .shake {
    animation: shake 0.3s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-3px, 2px); }
    40% { transform: translate(3px, -2px); }
    60% { transform: translate(-2px, -1px); }
    80% { transform: translate(2px, 1px); }
  }

  /* Screen flash red */
  .flash-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,0,51,0.1);
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.05s;
  }

  .flash-overlay.active {
    opacity: 1;
  }

  /* Typing cursor */
  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink-cursor 0.8s step-end infinite;
  }

  @keyframes blink-cursor {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Network graph mini */
  .mini-graph {
    display: flex;
    align-items: flex-end;
    gap: 1px;
    height: 20px;
  }

  .mini-graph-bar {
    width: 3px;
    background: var(--green);
    opacity: 0.6;
    transition: height 0.3s;
  }

  /* Data table */
  .data-table {
    margin: 6px 0;
    font-size: 11px;
    border-collapse: collapse;
  }

  .data-table th {
    color: var(--green-dim);
    text-align: left;
    padding: 2px 12px 2px 0;
    border-bottom: 1px solid var(--green-dark);
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    letter-spacing: 2px;
  }

  .data-table td {
    padding: 3px 12px 3px 0;
    border-bottom: 1px solid #0a1a0a;
  }

  .data-table tr:hover td {
    background: rgba(0,255,65,0.03);
  }

  /* Spinning loader */
  .spin {
    display: inline-block;
    animation: spin-anim 1s linear infinite;
  }

  @keyframes spin-anim {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .side-panel { display: none; }
    .terminal-wrapper { width: 100%; height: 100vh; max-height: none; border-radius: 0; border: none; }
    .top-bar-right { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .crt-flicker, .scanlines { display: none; }
    .glitch { animation: none; }
    .status-dot { animation: none; }
    .cursor-blink { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="matrixCanvas" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="crt-flicker" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="terminal-wrapper" id="terminalWrapper">
  <div class="flash-overlay" id="flashOverlay" aria-hidden="true"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="top-bar-dots">
        <span class="dot-red"></span>
        <span class="dot-amber"></span>
        <span class="dot-green"></span>
      </div>
      <span class="top-bar-title">ROOT ACCESS TERMINAL v4.7.1</span>
    </div>
    <div class="top-bar-right">
      <div class="status-indicator">
        <div class="status-dot" id="connDot"></div>
        <span id="connStatus">DISCONNECTED</span>
      </div>
      <span id="clockDisplay">00:00:00</span>
      <span>ENCRYPTED</span>
      <div class="mini-graph" id="netGraph" aria-label="Network activity graph"></div>
    </div>
  </div>

  <!-- Body -->
  <div class="terminal-body">
    <!-- Side Panel -->
    <nav class="side-panel" aria-label="Terminal navigation">
      <div class="side-section-title">Modules</div>
      <div class="side-item active" data-cmd="scan"><i class="fas fa-radar"></i> Network Scan</div>
      <div class="side-item" data-cmd="exploit"><i class="fas fa-skull-crossbones"></i> Exploit DB <span class="badge">3</span></div>
      <div class="side-item" data-cmd="crack"><i class="fas fa-key"></i> Password Crack</div>
      <div class="side-item" data-cmd="decrypt"><i class="fas fa-lock-open"></i> Decrypt</div>
      <div class="side-section-title">Recon</div>
      <div class="side-item" data-cmd="ports"><i class="fas fa-network-wired"></i> Port Map</div>
      <div class="side-item" data-cmd="sniff"><i class="fas fa-wifi"></i> Packet Sniff</div>
      <div class="side-item" data-cmd="trace"><i class="fas fa-route"></i> Trace Route</div>
      <div class="side-section-title">Access</div>
      <div class="side-item" data-cmd="payload"><i class="fas fa-biohazard"></i> Payloads</div>
      <div class="side-item" data-cmd="exfil"><i class="fas fa-file-export"></i> Data Exfil</div>
      <div class="side-item" data-cmd="wipe"><i class="fas fa-trash-alt"></i> Wipe Tracks</div>
      <div class="side-section-title">System</div>
      <div class="side-item" data-cmd="help"><i class="fas fa-terminal"></i> Help</div>
      <div class="side-item" data-cmd="clear"><i class="fas fa-eraser"></i> Clear</div>
    </nav>

    <!-- Main terminal -->
    <div class="main-terminal">
      <div class="terminal-output" id="terminalOutput" role="log" aria-live="polite"></div>
      <div class="input-area">
        <span class="prompt-symbol">root@breach:~$</span>
        <input type="text" class="terminal-input" id="terminalInput" placeholder="type a command..." autocomplete="off" autofocus aria-label="Terminal command input">
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="bottom-bar-section">
      <div class="bottom-bar-item"><i class="fas fa-shield-halved"></i> PROXY: 3 NODES</div>
      <div class="bottom-bar-item"><i class="fas fa-clock"></i> UPTIME: <span id="uptimeDisplay">00:00</span></div>
    </div>
    <div class="bottom-bar-section">
      <div class="bottom-bar-item">PID: <span id="pidDisplay">7741</span></div>
      <div class="bottom-bar-item">MEM: <span id="memDisplay">12%</span></div>
      <div class="bottom-bar-item"><i class="fas fa-skull"></i> THREAT: <span id="threatLevel" style="color:var(--red)">HIGH</span></div>
    </div>
  </div>
</div>

<script>
// ===================== MATRIX RAIN =====================
const matrixCanvas = document.getElementById('matrixCanvas');
const mCtx = matrixCanvas.getContext('2d');
let matrixCols = [];
const matrixChars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF<>/{}[];:';

function initMatrix() {
  matrixCanvas.width = window.innerWidth;
  matrixCanvas.height = window.innerHeight;
  const colCount = Math.floor(matrixCanvas.width / 14);
  matrixCols = [];
  for (let i = 0; i < colCount; i++) {
    matrixCols.push(Math.random() * matrixCanvas.height / 14);
  }
}

function drawMatrix() {
  mCtx.fillStyle = 'rgba(5,10,5,0.12)';
  mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
  mCtx.font = '13px Share Tech Mono';
  for (let i = 0; i < matrixCols.length; i++) {
    const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * 14;
    const y = matrixCols[i] * 14;
    mCtx.fillStyle = `rgba(0,255,65,${0.4 + Math.random() * 0.6})`;
    mCtx.fillText(char, x, y);
    if (y > matrixCanvas.height && Math.random() > 0.975) {
      matrixCols[i] = 0;
    }
    matrixCols[i]++;
  }
  requestAnimationFrame(drawMatrix);
}

initMatrix();
drawMatrix();
window.addEventListener('resize', initMatrix);

// ===================== MINI NETWORK GRAPH =====================
const netGraph = document.getElementById('netGraph');
const graphBars = [];
for (let i = 0; i < 20; i++) {
  const bar = document.createElement('div');
  bar.className = 'mini-graph-bar';
  bar.style.height = '2px';
  netGraph.appendChild(bar);
  graphBars.push(bar);
}

function updateGraph() {
  graphBars.forEach(bar => {
    bar.style.height = (2 + Math.random() * 18) + 'px';
    bar.style.background = Math.random() > 0.85 ? 'var(--red)' : 'var(--green)';
  });
}
setInterval(updateGraph, 400);

// ===================== CLOCK & UPTIME =====================
const clockEl = document.getElementById('clockDisplay');
const uptimeEl = document.getElementById('uptimeDisplay');
const memEl = document.getElementById('memDisplay');
let startTime = Date.now();

function updateClock() {
  const now = new Date();
  clockEl.textContent = now.toTimeString().split(' ')[0];
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  uptimeEl.textContent = `${m}:${s}`;
  memEl.textContent = (12 + Math.floor(Math.random() * 8)) + '%';
}
setInterval(updateClock, 1000);
updateClock();

// ===================== TERMINAL ENGINE =====================
const output = document.getElementById('terminalOutput');
const input = document.getElementById('terminalInput');
const wrapper = document.getElementById('terminalWrapper');
const flashOverlay = document.getElementById('flashOverlay');
const connDot = document.getElementById('connDot');
const connStatus = document.getElementById('connStatus');

let commandHistory = [];
let historyIndex = -1;
let isAnimating = false;
let connected = false;

// Add a line to terminal output
function addLine(text, cls = '') {
  const div = document.createElement('div');
  div.className = `line ${cls}`;
  div.innerHTML = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

// Add empty line
function addEmpty() {
  addLine('&nbsp;');
}

// Flash screen red
function flashScreen() {
  flashOverlay.classList.add('active');
  wrapper.classList.add('shake');
  setTimeout(() => {
    flashOverlay.classList.remove('active');
    wrapper.classList.remove('shake');
  }, 200);
}

// Simulate progress bar with callback
function animateProgress(label, target, duration, cls, onComplete) {
  return new Promise(resolve => {
    const container = document.createElement('div');
    container.className = 'progress-container';
    container.innerHTML = `
      <span style="font-size:11px;min-width:140px;color:var(--green-dim)">${label}</span>
      <div class="progress-bar-outer"><div class="progress-bar-inner ${cls || ''}"></div></div>
      <span class="progress-pct">0%</span>
    `;
    output.appendChild(container);
    output.scrollTop = output.scrollHeight;

    const bar = container.querySelector('.progress-bar-inner');
    const pct = container.querySelector('.progress-pct');
    let current = 0;
    const step = 16;
    const increment = target / (duration / step);

    const timer = setInterval(() => {
      current += increment + (Math.random() * 2 - 1);
      if (current >= target) {
        current = target;
        clearInterval(timer);
        bar.style.width = current + '%';
        pct.textContent = Math.floor(current) + '%';
        if (onComplete) onComplete();
        resolve();
      }
      bar.style.width = current + '%';
      pct.textContent = Math.floor(current) + '%';
      output.scrollTop = output.scrollHeight;
    }, step);
  });
}

// Type text character by character
function typeText(text, cls = '', speed = 20) {
  return new Promise(resolve => {
    const div = document.createElement('div');
    div.className = `line ${cls}`;
    output.appendChild(div);
    let i = 0;
    const timer = setInterval(() => {
      div.innerHTML = text.substring(0, i + 1) + '<span class="cursor-blink"></span>';
      i++;
      output.scrollTop = output.scrollHeight;
      if (i >= text.length) {
        clearInterval(timer);
        div.innerHTML = text;
        resolve();
      }
    }, speed);
  });
}

// Delay helper
function delay(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// Random IP
function randIP() {
  return `${Math.floor(Math.random()*223)+1}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
}

// Random hex
function randHex(len) {
  let s = '';
  for (let i = 0; i < len; i++) s += '0123456789abcdef'[Math.floor(Math.random()*16)];
  return s;
}

// Random MAC
function randMAC() {
  return Array.from({length:6}, () => randHex(2)).join(':');
}

// ===================== BOOT SEQUENCE =====================
async function bootSequence() {
  isAnimating = true;
  input.disabled = true;

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const cmd = input.value.trim().toLowerCase();
    if (!cmd) return;

    // Echo the command
    addLine(`<span class="prompt-symbol" style="font-size:13px">root@breach:~$</span> ${cmd}`, 'white');
    input.value = '';

    // Add to history
    commandHistory.unshift(cmd);
    if (commandHistory.length > 50) commandHistory.pop();
    historyIndex = -1;

    // Execute
    if (commandMap[cmd]) {
      commandMap[cmd]();
    } else {
      addLine(`<span class="error">[-] Command not found: '${cmd}'. Type 'help' for available commands.</span>`, 'error');
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      input.value = commandHistory[historyIndex];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = commandHistory[historyIndex];
    } else {
      historyIndex = -1;
      input.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const partial = input.value.trim().toLowerCase();
    const matches = Object.keys(commandMap).filter(c => c.startsWith(partial));
    if (matches.length === 1) {
      input.value = matches[0];
    } else if (matches.length > 1) {
      addLine(`<span class="prompt-symbol" style="font-size:13px">root@breach:~$</span> ${partial}`, 'white');
      addLine(matches.join('  '), 'dim');
    }
  }
});
