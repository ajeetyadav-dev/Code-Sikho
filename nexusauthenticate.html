<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus — Authenticate</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        :root {
            --bg: #060a08;
            --fg: #e4ebe6;
            --muted: #5e7565;
            --accent: #00e68a;
            --accent-dim: #00b36b;
            --accent-bright: #33ffaa;
            --card: rgba(8, 18, 12, 0.7);
            --border: rgba(0, 230, 138, 0.1);
            --error: #ff5c5c;
            --glow: rgba(0, 230, 138, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .ambient-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at 30% 70%, rgba(0, 230, 138, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 30%, rgba(0, 180, 100, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        /* ===== Scene wrapper ===== */
        .scene-wrapper {
            position: relative;
            z-index: 10;
            perspective: 1400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== Depth stack — cards behind the main one ===== */
        .depth-stack {
            position: absolute;
            width: 420px;
            max-width: 92vw;
            border-radius: 22px;
            pointer-events: none;
        }

        .depth-stack:nth-child(1) {
            transform: translateZ(-30px) translateY(18px) scale(0.96);
            background: rgba(0, 230, 138, 0.018);
            border: 1px solid rgba(0, 230, 138, 0.04);
            filter: blur(2px);
        }
        .depth-stack:nth-child(2) {
            transform: translateZ(-60px) translateY(36px) scale(0.92);
            background: rgba(0, 230, 138, 0.01);
            border: 1px solid rgba(0, 230, 138, 0.02);
            filter: blur(5px);
        }
        .depth-stack:nth-child(3) {
            transform: translateZ(-90px) translateY(54px) scale(0.88);
            background: rgba(0, 230, 138, 0.005);
            border: 1px solid rgba(0, 230, 138, 0.01);
            filter: blur(10px);
        }

        /* ===== Main 3D card ===== */
        .card-3d {
            width: 420px;
            max-width: 92vw;
            transform-style: preserve-3d;
            transition: transform 0.06s ease-out;
            will-change: transform;
            position: relative;
            z-index: 5;
        }

        /* Animated gradient border */
        .card-border-glow {
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            z-index: -1;
            opacity: 0.6;
            transition: opacity 0.5s;
            overflow: hidden;
        }

        .card-border-glow::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(
                from var(--border-angle, 0deg),
                transparent 0%,
                var(--accent) 10%,
                transparent 20%,
                transparent 50%,
                var(--accent-dim) 60%,
                transparent 70%
            );
            animation: borderSpin 4s linear infinite;
        }

        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes borderSpin {
            to { --border-angle: 360deg; }
        }

        .card-3d:hover .card-border-glow { opacity: 1; }

        .card-inner {
            position: relative;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform 0.75s cubic-bezier(0.4, 0, 0.15, 1);
        }

        .card-inner.flipped { transform: rotateY(180deg); }

        .card-face {
            width: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 22px;
            padding: 44px 38px 38px;
            background: var(--card);
            backdrop-filter: blur(50px) saturate(1.3);
            -webkit-backdrop-filter: blur(50px) saturate(1.3);
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(0,230,138,0.02),
                0 40px 100px -25px rgba(0,0,0,0.7),
                0 0 160px -50px var(--glow),
                inset 0 1px 0 rgba(255,255,255,0.03);
            overflow: hidden;
        }

        /* Subtle noise texture overlay on card */
        .card-face::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 22px;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .card-face > * { position: relative; z-index: 1; }

        .card-back {
            position: absolute;
            top: 0; left: 0;
            transform: rotateY(180deg);
        }

        /* ===== Staggered entrance animations ===== */
        .card-3d {
            opacity: 0;
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(60px) rotateX(8deg) scale(0.92); }
            to { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        }

        .stagger { opacity: 0; transform: translateY(20px); animation: staggerIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stagger:nth-child(1) { animation-delay: 0.5s; }
        .stagger:nth-child(2) { animation-delay: 0.6s; }
        .stagger:nth-child(3) { animation-delay: 0.7s; }
        .stagger:nth-child(4) { animation-delay: 0.8s; }
        .stagger:nth-child(5) { animation-delay: 0.9s; }
        .stagger:nth-child(6) { animation-delay: 1.0s; }
        .stagger:nth-child(7) { animation-delay: 1.1s; }
        .stagger:nth-child(8) { animation-delay: 1.2s; }

        @keyframes staggerIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Logo ===== */
        .logo-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .logo-mark {
            width: 48px; height: 48px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 20px;
            color: var(--bg);
            box-shadow: 0 6px 24px -6px var(--glow);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-mark::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
            animation: logoShine 3s ease-in-out infinite;
        }

        @keyframes logoShine {
            0%, 100% { transform: translateX(-100%) rotate(25deg); }
            50% { transform: translateX(100%) rotate(25deg); }
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.3px;
        }

        .logo-text span { color: var(--accent); }

        /* ===== Typography ===== */
        .card-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .card-subtitle {
            color: var(--muted);
            font-size: 13.5px;
            font-weight: 300;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        /* Typing cursor */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ===== Floating label inputs ===== */
        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i.field-icon {
            position: absolute;
            left: 16px;
            color: var(--muted);
            font-size: 13px;
            transition: color 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 2;
        }

        .input-wrap input {
            width: 100%;
            padding: 18px 16px 8px 44px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrap input::placeholder { color: transparent; }

        .floating-label {
            position: absolute;
            left: 44px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: rgba(255,255,255,0.2);
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }

        .input-wrap input:focus ~ .floating-label,
        .input-wrap input:not(:placeholder-shown) ~ .floating-label {
            top: 10px;
            transform: translateY(0);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .input-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,230,138,0.06), 0 0 24px -8px var(--glow);
            background: rgba(0,0,0,0.5);
        }

        .input-wrap input:focus ~ i.field-icon {
            color: var(--accent);
            transform: scale(1.1);
        }

        .input-wrap input.input-error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(255,92,92,0.06);
        }

        .input-wrap input.input-error ~ i.field-icon { color: var(--error); }

        .toggle-pass {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
            transition: color 0.3s;
            z-index: 2;
        }

        .toggle-pass:hover { color: var(--accent); }

        .error-msg {
            font-size: 11.5px;
            color: var(--error);
            margin-top: 6px;
            display: none;
            align-items: center;
            gap: 5px;
            padding-left: 4px;
        }

        .error-msg.visible { display: flex; }

        /* ===== Bottom line accent on focus ===== */
        .input-underline {
            position: absolute;
            bottom: 0; left: 50%;
            width: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 2px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }

        .input-wrap input:focus ~ .input-underline {
            left: 10%;
            width: 80%;
        }

        /* ===== Check row ===== */
        .check-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            font-size: 13px;
        }

        .check-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.3s;
        }

        .check-label:hover { color: var(--fg); }

        .check-label input[type="checkbox"] { display: none; }

        .custom-check {
            width: 18px; height: 18px;
            border-radius: 5px;
            border: 1.5px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }

        .custom-check i {
            font-size: 9px;
            color: var(--bg);
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .check-label input:checked + .custom-check {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 2px 12px -4px var(--glow);
            transform: scale(1.05);
        }

        .check-label input:checked + .custom-check i {
            opacity: 1;
            transform: scale(1) rotate(0);
        }

        .link-accent {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
            position: relative;
        }

        .link-accent::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0;
            width: 0; height: 1px;
            background: var(--accent);
            transition: width 0.3s;
        }

        .link-accent:hover::after { width: 100%; }
        .link-accent:hover { opacity: 0.85; }

        /* ===== Submit button ===== */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            color: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px -10px var(--glow);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 44px -10px rgba(0,230,138,0.35);
        }

        .btn-submit:active { transform: translateY(0) scale(0.98); }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover::before { left: 100%; }

        /* Ripple effect */
        .btn-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        .btn-submit.loading { pointer-events: none; opacity: 0.85; }
        .btn-submit .btn-text { transition: opacity 0.3s, transform 0.3s; }
        .btn-submit.loading .btn-text { opacity: 0; transform: translateY(10px); }

        .btn-spinner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 22px; height: 22px;
            border: 2.5px solid rgba(8,12,10,0.25);
            border-top-color: var(--bg);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
            animation: spin 0.65s linear infinite;
        }

        .btn-submit.loading .btn-spinner { opacity: 1; }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ===== Divider ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
        }

        /* ===== Social buttons ===== */
        .social-row { display: flex; gap: 10px; margin-bottom: 26px; }

        .btn-social {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
            color: var(--fg);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-social span { font-size: 12px; font-weight: 500; }

        .btn-social::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--sx, 50%) var(--sy, 50%), rgba(0,230,138,0.08), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-social:hover::after { opacity: 1; }

        .btn-social:hover {
            border-color: rgba(0,230,138,0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -8px rgba(0,0,0,0.4);
        }

        /* ===== Flip link ===== */
        .flip-link {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        .flip-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            position: relative;
        }

        .flip-link a::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0;
            width: 0; height: 1px;
            background: var(--accent);
            transition: width 0.3s;
        }

        .flip-link a:hover::after { width: 100%; }

        /* ===== Password strength ===== */
        .strength-bar { display: flex; gap: 4px; margin-top: 8px; }

        .strength-bar .seg {
            flex: 1;
            height: 3px;
            border-radius: 3px;
            background: rgba(255,255,255,0.05);
            transition: background 0.4s, box-shadow 0.4s;
        }

        .strength-bar.s1 .seg:nth-child(1) { background: var(--error); box-shadow: 0 0 8px rgba(255,92,92,0.3); }
        .strength-bar.s2 .seg:nth-child(-n+2) { background: #f0a500; box-shadow: 0 0 8px rgba(240,165,0,0.3); }
        .strength-bar.s3 .seg:nth-child(-n+3) { background: #a8d000; box-shadow: 0 0 8px rgba(168,208,0,0.3); }
        .strength-bar.s4 .seg { background: var(--accent); box-shadow: 0 0 8px var(--glow); }

        .strength-label { font-size: 10.5px; margin-top: 4px; color: var(--muted); transition: color 0.3s; font-weight: 500; }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 28px; right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 14px 22px;
            border-radius: 14px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            font-size: 13.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 50px -15px rgba(0,0,0,0.5);
            font-family: 'Space Grotesk', sans-serif;
        }

        .toast.show { transform: translateX(0); }

        .toast.success {
            background: rgba(0, 230, 138, 0.12);
            border: 1px solid rgba(0, 230, 138, 0.2);
            color: var(--accent);
        }

        .toast.error {
            background: rgba(255, 92, 92, 0.12);
            border: 1px solid rgba(255, 92, 92, 0.2);
            color: var(--error);
        }

        /* ===== Success overlay ===== */
        .success-overlay {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            background: var(--card);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .success-overlay.active { opacity: 1; pointer-events: auto; }

        .success-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--bg);
            margin-bottom: 24px;
            box-shadow: 0 0 60px -10px var(--glow);
            transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
        }

        .success-overlay.active .success-icon { transform: scale(1); }

        .success-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease 0.4s;
        }

        .success-overlay.active .success-title { opacity: 1; transform: translateY(0); }

        .success-sub {
            color: var(--muted);
            font-size: 13.5px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease 0.55s;
        }

        .success-overlay.active .success-sub { opacity: 1; transform: translateY(0); }

        /* Confetti particles */
        .confetti {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 1px;
            pointer-events: none;
            z-index: 60;
        }

        /* ===== CSS floating particles ===== */
        .css-particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            10% { opacity: 0.5; }
            90% { opacity: 0.05; }
            100% { opacity: 0; transform: translateY(-100vh) scale(0.2); }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .card-face { padding: 32px 22px 28px; }
            .card-title { font-size: 22px; }
            .social-row { flex-direction: column; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    </style>

    <!-- Three.js background -->
    <script type="module">
        import * as THREE from 'three';

        const canvas = document.getElementById('bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 35;

        /* --- Central morphing icosahedron --- */
        const icoGeo = new THREE.IcosahedronGeometry(5, 4);
        const icoOrigPositions = icoGeo.attributes.position.array.slice();

        const icoMat = new THREE.MeshBasicMaterial({
            color: 0x00e68a,
            wireframe: true,
            transparent: true,
            opacity: 0.07,
        });
        const ico = new THREE.Mesh(icoGeo, icoMat);
        ico.position.set(12, -2, -10);
        scene.add(ico);

        /* --- Secondary smaller shape --- */
        const torusGeo = new THREE.TorusKnotGeometry(2.5, 0.6, 100, 16, 2, 3);
        const torusMat = new THREE.MeshBasicMaterial({
            color: 0x00b36b,
            wireframe: true,
            transparent: true,
            opacity: 0.05,
        });
        const torusKnot = new THREE.Mesh(torusGeo, torusMat);
        torusKnot.position.set(-14, 5, -8);
        scene.add(torusKnot);

        /* --- Floating smaller shapes --- */
        const geoGroup = new THREE.Group();
        scene.add(geoGroup);

        const shapes = [
            new THREE.OctahedronGeometry(1, 0),
            new THREE.TetrahedronGeometry(1, 0),
            new THREE.DodecahedronGeometry(0.8, 0),
            new THREE.TorusGeometry(0.8, 0.25, 8, 16),
            new THREE.IcosahedronGeometry(0.7, 0),
        ];

        const mats = [
            new THREE.MeshBasicMaterial({ color: 0x00e68a, wireframe: true, transparent: true, opacity: 0.1 }),
            new THREE.MeshBasicMaterial({ color: 0x00b36b, wireframe: true, transparent: true, opacity: 0.06 }),
            new THREE.MeshBasicMaterial({ color: 0x00e68a, wireframe: false, transparent: true, opacity: 0.03 }),
        ];

        const floaters = [];
        for (let i = 0; i < 14; i++) {
            const geo = shapes[i % shapes.length];
            const mat = mats[i % mats.length].clone();
            const mesh = new THREE.Mesh(geo, mat);
            const s = 0.6 + Math.random() * 2;
            mesh.scale.set(s, s, s);
            mesh.position.set(
                (Math.random() - 0.5) * 70,
                (Math.random() - 0.5) * 50,
                (Math.random() - 0.5) * 30 - 10
            );
            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            geoGroup.add(mesh);
            floaters.push({
                mesh,
                rx: (Math.random() - 0.5) * 0.006,
                ry: (Math.random() - 0.5) * 0.006,
                rz: (Math.random() - 0.5) * 0.003,
                offset: Math.random() * Math.PI * 2,
                speed: 0.25 + Math.random() * 0.4,
                amp: 0.5 + Math.random() * 1.5,
                baseY: mesh.position.y,
            });
        }

        /* --- Particle field --- */
        const pCount = 500;
        const pGeo = new THREE.BufferGeometry();
        const pos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount; i++) {
            pos[i * 3] = (Math.random() - 0.5) * 90;
            pos[i * 3 + 1] = (Math.random() - 0.5) * 70;
            pos[i * 3 + 2] = (Math.random() - 0.5) * 50 - 5;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

        // Circular particle texture
        const pC = document.createElement('canvas');
        pC.width = 64; pC.height = 64;
        const pX = pC.getContext('2d');
        const g = pX.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0, 'rgba(0,230,138,1)');
        g.addColorStop(0.3, 'rgba(0,230,138,0.5)');
        g.addColorStop(1, 'rgba(0,230,138,0)');
        pX.fillStyle = g;
        pX.fillRect(0, 0, 64, 64);

        const pMat = new THREE.PointsMaterial({
            map: new THREE.CanvasTexture(pC),
            size: 0.6,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });

        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        /* --- Grid plane --- */
        const gridGeo = new THREE.PlaneGeometry(120, 120, 40, 40);
        const gridMat = new THREE.MeshBasicMaterial({
            color: 0x00e68a,
            wireframe: true,
            transparent: true,
            opacity: 0.015,
        });
        const grid = new THREE.Mesh(gridGeo, gridMat);
        grid.rotation.x = -Math.PI / 2;
        grid.position.y = -25;
        scene.add(grid);

        /* --- Mouse tracking --- */
        let mx = 0, my = 0, tmx = 0, tmy = 0;
        document.addEventListener('mousemove', (e) => {
            tmx = (e.clientX / window.innerWidth - 0.5) * 2;
            tmy = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            mx += (tmx - mx) * 0.025;
            my += (tmy - my) * 0.025;

            camera.position.x = mx * 5;
            camera.position.y = -my * 3;
            camera.lookAt(0, 0, 0);

            // Morph icosahedron vertices
            const positions = icoGeo.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                const ox = icoOrigPositions[i];
                const oy = icoOrigPositions[i + 1];
                const oz = icoOrigPositions[i + 2];
                const noise = Math.sin(ox * 2 + t * 0.8) * Math.cos(oy * 2 + t * 0.6) * Math.sin(oz * 2 + t * 0.7) * 0.35;
                const len = Math.max(0.001, Math.sqrt(ox * ox + oy * oy + oz * oz));
                const scale = 1 + noise;
                positions[i] = (ox / len) * len * scale;
                positions[i + 1] = (oy / len) * len * scale;
                positions[i + 2] = (oz / len) * len * scale;
            }
            icoGeo.attributes.position.needsUpdate = true;
            ico.rotation.y = t * 0.15;
            ico.rotation.x = Math.sin(t * 0.1) * 0.3;

            // Torus knot
            torusKnot.rotation.x = t * 0.2;
            torusKnot.rotation.y = t * 0.15;

            // Floaters
            for (const f of floaters) {
                f.mesh.rotation.x += f.rx;
                f.mesh.rotation.y += f.ry;
                f.mesh.rotation.z += f.rz;
                f.mesh.position.y = f.baseY + Math.sin(t * f.speed + f.offset) * f.amp;
            }

            // Particles
            particles.rotation.y = t * 0.015;
            particles.rotation.x = Math.sin(t * 0.008) * 0.08;

            // Grid wave
            const gPos = gridGeo.attributes.position.array;
            for (let i = 0; i < gPos.length; i += 3) {
                gPos[i + 2] = Math.sin(gPos[i] * 0.1 + t * 0.5) * Math.cos(gPos[i + 1] * 0.1 + t * 0.3) * 1.5;
            }
            gridGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <!-- Interaction logic -->
    <script>
        // ===== Typing effect =====
        const phrases = [
            'Enter your credentials to continue',
            'Secure access to your workspace',
            'Your gateway to the Nexus platform',
        ];
        let phraseIdx = 0, charIdx = 0, isDeleting = false;
        const typedEl = document.getElementById('typedText');
        const cursorEl = document.getElementById('cursor');

        function typeEffect() {
            const current = phrases[phraseIdx];
            if (!isDeleting) {
                typedEl.textContent = current.substring(0, charIdx + 1);
                charIdx++;
                if (charIdx === current.length) {
                    setTimeout(() => { isDeleting = true; typeEffect(); }, 2000);
                    return;
                }
                setTimeout(typeEffect, 40 + Math.random() * 30);
            } else {
                typedEl.textContent = current.substring(0, charIdx - 1);
                charIdx--;
                if (charIdx === 0) {
                    isDeleting = false;
                    phraseIdx = (phraseIdx + 1) % phrases.length;
                    setTimeout(typeEffect, 400);
                    return;
                }
                setTimeout(typeEffect, 20);
            }
        }
        setTimeout(typeEffect, 1200);

        // ===== Card 3D tilt =====
        const card3d = document.getElementById('card3d');
        const sceneWrapper = document.querySelector('.scene-wrapper');
        let tiltX = 0, tiltY = 0, tTiltX = 0, tTiltY = 0;

        document.addEventListener('mousemove', (e) => {
            const r = sceneWrapper.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            tTiltY = Math.max(-15, Math.min(15, ((e.clientX - cx) / (r.width / 2)) * 15));
            tTiltX = Math.max(-15, Math.min(15, -((e.clientY - cy) / (r.height / 2)) * 15));
        });

        function updateTilt() {
            tiltX += (tTiltX - tiltX) * 0.07;
            tiltY += (tTiltY - tiltY) * 0.07;
            const flipped = document.getElementById('cardInner').classList.contains('flipped');
            card3d.style.transform = `rotateX(${tiltX}deg) rotateY(${flipped ? -tiltY : tiltY}deg)`;
            requestAnimationFrame(updateTilt);
        }
        updateTilt();

        document.addEventListener('mouseleave', () => { tTiltX = 0; tTiltY = 0; });

        // ===== Card flip =====
        function flipCard() {
            document.getElementById('cardInner').classList.toggle('flipped');
            tTiltX = 0; tTiltY = 0;
            document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('visible'));
            document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
        }

        document.getElementById('toRegister').addEventListener('click', flipCard);
        document.getElementById('toLogin').addEventListener('click', flipCard);
        [document.getElementById('toRegister'), document.getElementById('toLogin')].forEach(a => {
            a.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipCard(); } });
        });

        // ===== Toast system =====
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-xmark'}"></i><span>${msg}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => { requestAnimationFrame(() => { toast.classList.add('show'); }); });
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 3500);
        }

        // ===== Password toggle =====
        document.querySelectorAll('.toggle-pass').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('i');
                if (input.type === 'password') { input.type = 'text'; icon.className = 'fa-solid fa-eye-slash'; }
                else { input.type = 'password'; icon.className = 'fa-solid fa-eye'; }
            });
        });

        // ===== Validation =====
        function showError(id, msg) {
            const el = document.getElementById(id);
            el.querySelector('span').textContent = msg;
            el.classList.add('visible');
            const input = el.parentElement.querySelector('input');
            if (input) input.classList.add('input-error');
        }

        function clearError(id) {
            const el = document.getElementById(id);
            el.classList.remove('visible');
            const input = el.parentElement.querySelector('input');
            if (input) input.classList.remove('input-error');
        }

        function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

        document.querySelectorAll('.input-wrap input').forEach(input => {
            input.addEventListener('input', () => {
                const err = input.closest('.input-group').querySelector('.error-msg');
                if (err) { err.classList.remove('visible'); input.classList.remove('input-error'); }
            });
        });

        // ===== Button ripple =====
        document.querySelectorAll('.btn-submit').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'btn-ripple';
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top = (e.clientY - rect.top) + 'px';
                ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // ===== Social button radial glow follow =====
        document.querySelectorAll('.btn-social').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const r = btn.getBoundingClientRect();
                btn.style.setProperty('--sx', ((e.clientX - r.left) / r.width * 100) + '%');
                btn.style.setProperty('--sy', ((e.clientY - r.top) / r.height * 100) + '%');
            });
            btn.addEventListener('click', () => {
                showToast(`${btn.dataset.provider} authentication initiated`, 'success');
            });
        });

        // ===== Forgot password =====
        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            showToast('Check your inbox for a reset link', 'success');
        });

        // ===== Password strength =====
        const regPass = document.getElementById('regPass');
        const sBar = document.getElementById('strengthBar');
        const sLabel = document.getElementById('strengthLabel');

        regPass.addEventListener('input', () => {
            const v = regPass.value;
            let s = 0;
            if (v.length >= 8) s++;
            if (/[A-Z]/.test(v)) s++;
            if (/[0-9]/.test(v)) s++;
            if (/[^A-Za-z0-9]/.test(v)) s++;
            sBar.className = 'strength-bar' + (s > 0 ? ' s' + s : '');
            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
            const colors = ['', '#ff5c5c', '#f0a500', '#a8d000', '#00e68a'];
            sLabel.textContent = v.length > 0 ? labels[s] : '';
            sLabel.style.color = colors[s] || 'var(--muted)';
        });

        // ===== Confetti burst =====
        function spawnConfetti(parent) {
            const colors = ['#00e68a', '#00b36b', '#33ffaa', '#00ffcc', '#88ffcc', '#ffffff'];
            for (let i = 0; i < 40; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.left = '50%';
                c.style.top = '50%';
                c.style.width = (3 + Math.random() * 5) + 'px';
                c.style.height = (3 + Math.random() * 5) + 'px';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '1px';
                parent.appendChild(c);
                const angle = (Math.random() * Math.PI * 2);
                const velocity = 100 + Math.random() * 200;
                const dx = Math.cos(angle) * velocity;
                const dy = Math.sin(angle) * velocity - 100;
                const rot = Math.random() * 720 - 360;
                c.animate([
                    { transform: 'translate(-50%, -50%) rotate(0deg) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg) scale(0)`, opacity: 0 }
                ], { duration: 800 + Math.random() * 400, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' }).onfinish = () => c.remove();
            }
        }

        // ===== Login submit =====
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let valid = true;
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            clearError('loginEmailErr');
            clearError('loginPassErr');

            if (!email) { showError('loginEmailErr', 'Email is required'); valid = false; }
            else if (!isValidEmail(email)) { showError('loginEmailErr', 'Enter a valid email address'); valid = false; }
            if (!pass) { showError('loginPassErr', 'Password is required'); valid = false; }
            else if (pass.length < 6) { showError('loginPassErr', 'At least 6 characters required'); valid = false; }
            if (!valid) return;

            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            setTimeout(() => {
                btn.classList.remove('loading');
                const overlay = document.getElementById('loginSuccess');
                overlay.classList.add('active');
                spawnConfetti(overlay);
                showToast('Successfully signed in', 'success');
                // Reset after a while
                setTimeout(() => {
                    overlay.classList.remove('active');
                    document.getElementById('loginForm').reset();
                }, 4000);
            }, 1800);
        });

        // ===== Register submit =====
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let valid = true;
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const agree = document.getElementById('agreeTerms').checked;
            clearError('regNameErr');
            clearError('regEmailErr');
            clearError('regPassErr');

            if (!name) { showError('regNameErr', 'Full name is required'); valid = false; }
            else if (name.length < 2) { showError('regNameErr', 'At least 2 characters'); valid = false; }
            if (!email) { showError('regEmailErr', 'Email is required'); valid = false; }
            else if (!isValidEmail(email)) { showError('regEmailErr', 'Enter a valid email address'); valid = false; }
            if (!pass) { showError('regPassErr', 'Password is required'); valid = false; }
            else if (pass.length < 8) { showError('regPassErr', 'Minimum 8 characters'); valid = false; }
            if (!agree) { showToast('Please agree to the Terms of Service', 'error'); valid = false; }
            if (!valid) return;

            const btn = document.getElementById('regBtn');
            btn.classList.add('loading');
            setTimeout(() => {
                btn.classList.remove('loading');
                const overlay = document.getElementById('regSuccess');
                overlay.classList.add('active');
                spawnConfetti(overlay);
                showToast('Account created successfully', 'success');
                setTimeout(() => {
                    overlay.classList.remove('active');
                    document.getElementById('registerForm').reset();
                    sBar.className = 'strength-bar';
                    sLabel.textContent = '';
                    setTimeout(flipCard, 300);
                }, 3000);
            }, 2000);
        });

        // ===== CSS floating particles =====
        const pContainer = document.getElementById('css-particles');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'css-particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-10px';
            const size = 1 + Math.random() * 2.5;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.background = Math.random() > 0.3 ? 'var(--accent)' : 'rgba(255,255,255,0.5)';
            p.style.animationDuration = (7 + Math.random() * 12) + 's';
            p.style.animationDelay = (Math.random() * 12) + 's';
            pContainer.appendChild(p);
        }
    </script>
</body>
</html>
