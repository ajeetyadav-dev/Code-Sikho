<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Door Open → Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #1a1410;
    --bg-warm: #231c14;
    --fg: #f5efe6;
    --muted: #9a8e7f;
    --accent: #d4943a;
    --accent-glow: #e8a94e;
    --card: rgba(35, 28, 20, 0.75);
    --border: rgba(212, 148, 58, 0.2);
    --door-dark: #3a2a1a;
    --door-mid: #5c3d20;
    --door-light: #7a5230;
    --door-frame: #2a1e12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ===== SCENE CONTAINER ===== */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 1800px;
    overflow: hidden;
  }

  /* ===== BACKGROUND LAYERS ===== */
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .bg-gradient {
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(212,148,58,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 120% 100% at 50% 120%, rgba(30,20,10,1) 0%, transparent 60%),
      linear-gradient(180deg, #1a1410 0%, #0f0b07 100%);
  }

  .bg-pattern {
    opacity: 0.03;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(255,255,255,0.1) 50px),
      repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(255,255,255,0.1) 50px);
    background-size: 50px 50px;
  }

  /* Floating ambient particles */
  .ambient-particle {
    position: absolute;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    animation: floatParticle 8s infinite ease-in-out;
    pointer-events: none;
  }

  @keyframes floatParticle {
    0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
    20% { opacity: 0.4; }
    50% { opacity: 0.6; transform: translateY(-80px) scale(1); }
    80% { opacity: 0.2; }
  }

  /* ===== LIGHT BEAM (appears after door opens) ===== */
  .light-beam {
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%) rotate(0deg);
    width: 0;
    height: 120%;
    background: linear-gradient(180deg, rgba(212,148,58,0.15) 0%, rgba(212,148,58,0.02) 100%);
    clip-path: polygon(40% 0%, 60% 0%, 80% 100%, 20% 100%);
    z-index: 1;
    transition: width 1.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 1.5s ease;
    opacity: 0;
    pointer-events: none;
  }

  .light-beam.active {
    width: 60vw;
    opacity: 1;
  }

  /* ===== DOOR FRAME ===== */
  .door-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 560px;
    z-index: 10;
    transition: opacity 0.8s ease 0.5s;
  }

  .door-frame.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .frame-border {
    position: absolute;
    inset: -18px;
    background: linear-gradient(135deg, var(--door-frame) 0%, #1e150c 100%);
    border-radius: 8px 8px 4px 4px;
    box-shadow:
      0 0 60px rgba(0,0,0,0.8),
      inset 0 0 30px rgba(0,0,0,0.5),
      0 0 120px rgba(212,148,58,0.05);
  }

  .frame-arch {
    position: absolute;
    top: -18px;
    left: -18px;
    right: -18px;
    height: 50px;
    background: linear-gradient(180deg, rgba(212,148,58,0.1) 0%, transparent 100%);
    border-radius: 8px 8px 0 0;
  }

  /* ===== THE DOOR ===== */
  .door-container {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.8s cubic-bezier(0.23, 1, 0.32, 1);
    cursor: pointer;
    z-index: 12;
  }

  .door-container.open {
    transform: rotateY(-110deg);
  }

  .door {
    width: 100%;
    height: 100%;
    position: relative;
    background:
      linear-gradient(90deg, var(--door-dark) 0%, var(--door-mid) 15%, var(--door-light) 30%, var(--door-mid) 50%, var(--door-dark) 70%, var(--door-mid) 85%, var(--door-light) 100%);
    border-radius: 4px 4px 2px 2px;
    overflow: hidden;
    box-shadow:
      inset -8px 0 20px rgba(0,0,0,0.4),
      inset 4px 0 10px rgba(0,0,0,0.2),
      4px 0 15px rgba(0,0,0,0.5);
  }

  /* Wood grain lines */
  .door::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 12px,
      rgba(0,0,0,0.08) 12px,
      rgba(0,0,0,0.08) 13px,
      transparent 13px,
      transparent 28px,
      rgba(255,255,255,0.03) 28px,
      rgba(255,255,255,0.03) 29px
    );
    pointer-events: none;
  }

  /* Door panels */
  .door-panel {
    position: absolute;
    left: 24px;
    right: 24px;
    height: 160px;
    border: 2px solid rgba(0,0,0,0.3);
    border-radius: 4px;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 50%, rgba(0,0,0,0.1) 100%),
      linear-gradient(90deg, var(--door-mid) 0%, var(--door-light) 40%, var(--door-mid) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -1px 0 rgba(0,0,0,0.3),
      2px 2px 8px rgba(0,0,0,0.3);
  }

  .door-panel.top { top: 40px; }
  .door-panel.bottom { bottom: 40px; }

  /* Door handle */
  .door-handle-area {
    position: absolute;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
  }

  .door-handle-backplate {
    width: 28px;
    height: 90px;
    background: linear-gradient(180deg, #c9a84c 0%, #a8862e 30%, #d4b05a 60%, #8a6b1f 100%);
    border-radius: 14px;
    box-shadow:
      2px 2px 10px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.3);
    position: relative;
  }

  .door-handle-grip {
    position: absolute;
    right: -16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    background: radial-gradient(circle at 40% 35%, #e8c96a, #a8862e);
    border-radius: 50%;
    box-shadow:
      2px 2px 8px rgba(0,0,0,0.6),
      inset 0 -1px 2px rgba(0,0,0,0.3),
      inset 0 1px 1px rgba(255,255,255,0.4);
  }

  .door-keyhole {
    position: absolute;
    right: 34px;
    top: calc(50% + 36px);
    width: 10px;
    height: 14px;
    background: radial-gradient(ellipse, #0a0704 60%, #1a140e 100%);
    border-radius: 50% 50% 40% 40%;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
  }

  /* Door hinge */
  .door-hinge {
    position: absolute;
    left: -6px;
    width: 12px;
    height: 40px;
    background: linear-gradient(90deg, #8a6b1f, #c9a84c, #8a6b1f);
    border-radius: 3px;
    box-shadow: 1px 0 6px rgba(0,0,0,0.5);
    z-index: 3;
  }
  .door-hinge.top { top: 40px; }
  .door-hinge.bottom { bottom: 40px; }

  /* Knock prompt */
  .knock-prompt {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    animation: pulsePrompt 2.5s ease-in-out infinite;
    transition: opacity 0.4s ease;
  }

  .knock-prompt i {
    margin-right: 6px;
    color: var(--accent);
  }

  @keyframes pulsePrompt {
    0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
    50% { opacity: 1; transform: translateX(-50%) translateY(-3px); }
  }

  /* Door shadow on floor */
  .door-shadow {
    position: absolute;
    bottom: -40px;
    left: -30px;
    right: -30px;
    height: 40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, transparent 70%);
    transition: all 1.8s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .door-container.open ~ .door-shadow {
    transform: skewX(-40deg) translateX(40px);
    opacity: 0.3;
  }

  /* ===== SIGN-IN PAGE (behind door) ===== */
  .signin-page {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.2s ease 0.6s;
    pointer-events: none;
  }

  .signin-page.active {
    opacity: 1;
    pointer-events: all;
  }

  .signin-card {
    width: 420px;
    max-width: 90vw;
    background: var(--card);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px 40px;
    position: relative;
    overflow: hidden;
    transform: translateY(20px) scale(0.96);
    transition: transform 1.2s cubic-bezier(0.23, 1, 0.32, 1) 0.6s;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.5),
      0 0 0 1px rgba(212,148,58,0.05),
      inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .signin-page.active .signin-card {
    transform: translateY(0) scale(1);
  }

  .signin-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    opacity: 0.5;
  }

  .signin-card::after {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(212,148,58,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Welcome text */
  .signin-welcome {
    text-align: center;
    margin-bottom: 36px;
  }

  .signin-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(212,148,58,0.15), rgba(212,148,58,0.05));
    border: 1px solid rgba(212,148,58,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--accent);
  }

  .signin-welcome h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 28px;
    color: var(--fg);
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .signin-welcome p {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
  }

  /* Form fields */
  .form-group {
    margin-bottom: 20px;
    position: relative;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-wrapper i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: var(--muted);
    transition: color 0.3s ease;
    pointer-events: none;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 400;
    outline: none;
    transition: all 0.3s ease;
  }

  .form-input::placeholder {
    color: rgba(154,142,127,0.5);
  }

  .form-input:focus {
    border-color: var(--accent);
    background: rgba(0,0,0,0.4);
    box-shadow: 0 0 0 3px rgba(212,148,58,0.1);
  }

  .form-input:focus + i,
  .form-input:focus ~ i {
    color: var(--accent);
  }

  .input-wrapper:has(.form-input:focus) i {
    color: var(--accent);
  }

  .password-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    transition: color 0.3s ease;
    pointer-events: all;
  }

  .password-toggle:hover {
    color: var(--accent);
  }

  /* Options row */
  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    user-select: none;
  }

  .remember-me input {
    display: none;
  }

  .custom-checkbox {
    width: 18px;
    height: 18px;
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .custom-checkbox i {
    font-size: 10px;
    color: var(--bg);
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .remember-me input:checked ~ .custom-checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }

  .remember-me input:checked ~ .custom-checkbox i {
    opacity: 1;
  }

  .forgot-link {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    transition: opacity 0.2s ease;
  }

  .forgot-link:hover {
    opacity: 0.8;
  }

  /* Submit button */
  .signin-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent) 0%, #b87a28 100%);
    border: none;
    border-radius: 12px;
    color: #1a1410;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(212,148,58,0.3);
  }

  .signin-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.6s ease;
  }

  .signin-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 30px rgba(212,148,58,0.4);
  }

  .signin-btn:hover::before {
    left: 100%;
  }

  .signin-btn:active {
    transform: translateY(0);
  }

  .signin-btn.loading {
    pointer-events: none;
    opacity: 0.8;
  }

  .btn-text { transition: opacity 0.3s ease; }
  .btn-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .signin-btn.loading .btn-text { opacity: 0; }
  .signin-btn.loading .btn-spinner { opacity: 1; }

  .btn-spinner i {
    animation: spin 1s linear infinite;
    font-size: 18px;
    color: #1a1410;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 24px 0;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.06);
  }

  .divider span {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
  }

  /* Social buttons */
  .social-row {
    display: flex;
    gap: 12px;
  }

  .social-btn {
    flex: 1;
    padding: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    color: var(--fg);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .social-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.12);
    transform: translateY(-1px);
  }

  /* Sign-up link */
  .signup-link {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--muted);
  }

  .signup-link a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    transition: opacity 0.2s ease;
  }

  .signup-link a:hover { opacity: 0.8; }

  /* Toast notification */
  .toast {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 100;
    padding: 16px 24px;
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--fg);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transform: translateX(120%);
    transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }

  .toast.show { transform: translateX(0); }
  .toast.success i { color: #4ade80; }
  .toast.error i { color: #f87171; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.2s !important;
    }
  }

  /* Mobile adjustments */
  @media (max-width: 480px) {
    .door-frame {
      width: 240px;
      height: 420px;
    }
    .door-panel { left: 16px; right: 16px; height: 120px; }
    .door-panel.top { top: 30px; }
    .door-panel.bottom { bottom: 30px; }
    .signin-card { padding: 36px 24px 32px; }
    .signin-welcome h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <!-- Background layers -->
  <div class="bg-layer bg-gradient"></div>
  <div class="bg-layer bg-pattern"></div>

  <!-- Ambient particles (generated by JS) -->
  <div id="particles"></div>

  <!-- Light beam behind door -->
  <div class="light-beam" id="lightBeam"></div>

  <!-- Sign-in page (behind door) -->
  <div class="signin-page" id="signinPage">
    <div class="signin-card">
      <div class="signin-welcome">
        <div class="signin-icon">
          <i class="fas fa-fingerprint"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Enter your credentials to continue</p>
      </div>

      <form id="signinForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              aria-label="Email address"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-label="Password"
            >
            <button type="button" class="password-toggle" id="passToggle" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span class="custom-checkbox"><i class="fas fa-check"></i></span>
            Remember me
          </label>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="signin-btn" id="signinBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner"><i class="fas fa-circle-notch"></i></span>
        </button>
      </form>

      <div class="divider"><span>or continue with</span></div>

      <div class="social-row">
        <button class="social-btn" aria-label="Sign in with Google" id="googleBtn">
          <i class="fab fa-google"></i>
        </button>
        <button class="social-btn" aria-label="Sign in with Apple" id="appleBtn">
          <i class="fab fa-apple"></i>
        </button>
        <button class="social-btn" aria-label="Sign in with GitHub" id="githubBtn">
          <i class="fab fa-github"></i>
        </button>
      </div>

      <div class="signup-link">
        Don't have an account? <a href="#" id="signupLink">Create one</a>
      </div>
    </div>
  </div>

  <!-- Door frame + door -->
  <div class="door-frame" id="doorFrame">
    <div class="frame-border">
      <div class="frame-arch"></div>
    </div>

    <div class="door-container" id="doorContainer" role="button" tabindex="0" aria-label="Open door to sign in">
      <div class="door-hinge top"></div>
      <div class="door-hinge bottom"></div>
      <div class="door">
        <div class="door-panel top"></div>
        <div class="door-panel bottom"></div>
        <div class="door-handle-area">
          <div class="door-handle-backplate"></div>
          <div class="door-handle-grip"></div>
        </div>
        <div class="door-keyhole"></div>
      </div>
    </div>

    <div class="door-shadow"></div>
    <div class="knock-prompt" id="knockPrompt">
      <i class="fas fa-hand-pointer"></i> Click to enter
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastMsg">Success!</span>
</div>

<script>
  // ===== DOM References =====
  const scene = document.getElementById('scene');
  const doorContainer = document.getElementById('doorContainer');
  const doorFrame = document.getElementById('doorFrame');
  const lightBeam = document.getElementById('lightBeam');
  const signinPage = document.getElementById('signinPage');
  const knockPrompt = document.getElementById('knockPrompt');
  const signinForm = document.getElementById('signinForm');
  const signinBtn = document.getElementById('signinBtn');
  const passToggle = document.getElementById('passToggle');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const forgotLink = document.getElementById('forgotLink');
  const signupLink = document.getElementById('signupLink');
  const googleBtn = document.getElementById('googleBtn');
  const appleBtn = document.getElementById('appleBtn');
  const githubBtn = document.getElementById('githubBtn');

  let doorOpened = false;

  // ===== Generate Ambient Particles =====
  (function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'ambient-particle';
      const size = Math.random() * 3 + 1;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.animationDuration = (6 + Math.random() * 6) + 's';
      container.appendChild(p);
    }
  })();

  // ===== Subtle mouse parallax on background =====
  document.addEventListener('mousemove', (e) => {
    if (doorOpened) return;
    const x = (e.clientX / window.innerWidth - 0.5) * 10;
    const y = (e.clientY / window.innerHeight - 0.5) * 10;
    doorFrame.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  });

  // ===== Open Door =====
  function openDoor() {
    if (doorOpened) return;
    doorOpened = true;

    knockPrompt.style.opacity = '0';
    doorContainer.classList.add('open');
    lightBeam.classList.add('active');

    // Reveal sign-in page
    setTimeout(() => {
      signinPage.classList.add('active');
    }, 300);

    // Hide door frame after animation
    setTimeout(() => {
      doorFrame.classList.add('hidden');
    }, 2000);
  }

  doorContainer.addEventListener('click', openDoor);
  doorContainer.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openDoor();
    }
  });

  // ===== Password Toggle =====
  passToggle.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    passToggle.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
  });

  // ===== Toast System =====
  function showToast(message, type = 'success') {
    toast.className = 'toast ' + type;
    toastMsg.textContent = message;
    toast.querySelector('i').className = type === 'success'
      ? 'fas fa-check-circle'
      : 'fas fa-exclamation-circle';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ===== Form Validation & Submit =====
  signinForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    // Validate email
    if (!email) {
      showToast('Please enter your email address', 'error');
      emailInput.focus();
      shakeElement(emailInput.closest('.form-group'));
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showToast('Please enter a valid email address', 'error');
      emailInput.focus();
      shakeElement(emailInput.closest('.form-group'));
      return;
    }

    // Validate password
    if (!password) {
      showToast('Please enter your password', 'error');
      passwordInput.focus();
      shakeElement(passwordInput.closest('.form-group'));
      return;
    }

    if (password.length < 6) {
      showToast('Password must be at least 6 characters', 'error');
      passwordInput.focus();
      shakeElement(passwordInput.closest('.form-group'));
      return;
    }

    // Simulate sign in
    signinBtn.classList.add('loading');

    setTimeout(() => {
      signinBtn.classList.remove('loading');
      showToast('Welcome back! Signing you in...', 'success');

      // Brief success animation on card
      const card = document.querySelector('.signin-card');
      card.style.borderColor = 'rgba(74, 222, 128, 0.3)';
      card.style.boxShadow = '0 40px 80px rgba(0,0,0,0.5), 0 0 40px rgba(74,222,128,0.08)';
      setTimeout(() => {
        card.style.borderColor = '';
        card.style.boxShadow = '';
      }, 2000);
    }, 1800);
  });

  // Shake animation for invalid fields
  function shakeElement(el) {
    el.style.animation = 'none';
    el.offsetHeight; // Force reflow
    el.style.animation = 'shake 0.5s ease';
    setTimeout(() => el.style.animation = '', 500);
  }

  // Add shake keyframe dynamically
  const shakeStyle = document.createElement('style');
  shakeStyle.textContent = `
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px); }
      30% { transform: translateX(6px); }
      45% { transform: translateX(-5px); }
      60% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
      90% { transform: translateX(1px); }
    }
  `;
  document.head.appendChild(shakeStyle);

  // ===== Social & Link Handlers =====
  googleBtn.addEventListener('click', () => showToast('Google sign-in initiated', 'success'));
  appleBtn.addEventListener('click', () => showToast('Apple sign-in initiated', 'success'));
  githubBtn.addEventListener('click', () => showToast('GitHub sign-in initiated', 'success'));

  forgotLink.addEventListener('click', (e) => {
    e.preventDefault();
    showToast('Password reset link sent to your email', 'success');
  });

  signupLink.addEventListener('click', (e) => {
    e.preventDefault();
    showToast('Redirecting to sign-up page...', 'success');
  });

  // ===== Input focus visual enhancement =====
  document.querySelectorAll('.form-input').forEach(input => {
    input.addEventListener('focus', () => {
      input.closest('.form-group').querySelector('label').style.color = 'var(--accent)';
    });
    input.addEventListener('blur', () => {
      input.closest('.form-group').querySelector('label').style.color = '';
    });
  });

  // ===== Auto-open door on first visit after short delay =====
  // (Optional: remove this block if you want manual-only opening)
  // setTimeout(openDoor, 1500);
</script>

</body>
</html>
